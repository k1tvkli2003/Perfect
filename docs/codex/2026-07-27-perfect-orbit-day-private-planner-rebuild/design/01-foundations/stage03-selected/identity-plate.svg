<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1600" height="1000" viewBox="0 0 1600 1000">
  <defs>
    <linearGradient id="canvas" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fffdf9"/>
      <stop offset="1" stop-color="#f8f3ed"/>
    </linearGradient>
    <linearGradient id="apricot" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#ffd69c"/><stop offset="1" stop-color="#f6a65b"/></linearGradient>
    <linearGradient id="mint" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#d4f3e6"/><stop offset="1" stop-color="#74c9aa"/></linearGradient>
    <linearGradient id="lavender" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#e7ddff"/><stop offset="1" stop-color="#a790e0"/></linearGradient>
    <linearGradient id="graphite" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#2e3341"/><stop offset="1" stop-color="#171b26"/></linearGradient>
    <filter id="shadow" x="-40%" y="-40%" width="180%" height="180%"><feDropShadow dx="0" dy="12" stdDeviation="18" flood-color="#332b22" flood-opacity=".12"/></filter>
    <filter id="smallShadow" x="-40%" y="-40%" width="180%" height="180%"><feDropShadow dx="0" dy="5" stdDeviation="8" flood-color="#332b22" flood-opacity=".10"/></filter>
    <style>
      .ui{font-family:"Segoe UI",Arial,sans-serif;fill:#202332}.eyebrow{font-size:14px;font-weight:700;letter-spacing:2px;fill:#8b806f}.h1{font-size:46px;font-weight:750;letter-spacing:-1.5px}.h2{font-size:24px;font-weight:700}.body{font-size:17px;fill:#625d70}.tiny{font-size:13px;fill:#777184}.label{font-size:15px;font-weight:650}.hair{stroke:#e4ddd4;stroke-width:1}.panel{fill:#fffefa;stroke:#e8e0d6;stroke-width:1.2}.darkPanel{fill:#1b1e29;stroke:#3a3e4d;stroke-width:1.2}.mono{font-variant-numeric:tabular-nums}
    </style>
  </defs>
  <rect width="1600" height="1000" fill="url(#canvas)"/>
  <text class="ui eyebrow" x="72" y="74">PS01 · PERFECT DAY INSTRUMENT</text>
  <text class="ui h1" x="72" y="132">Identity that stays exact at every scale</text>
  <text class="ui body" x="72" y="168">Selected Day Compass mark · selected wordmark image · semantic pastel · platform-safe expressions</text>

  <g filter="url(#shadow)">
    <rect class="panel" x="72" y="216" width="700" height="420" rx="36"/>
  </g>
  <text class="ui eyebrow" x="112" y="262">MASTER — TRANSPARENT FIELD</text>
  <image x="108" y="298" width="272" height="272" xlink:href="day-compass-transparent-512.png" preserveAspectRatio="xMidYMid meet"/>
  <image x="414" y="350" width="296" height="118" xlink:href="perfect-wordmark.png" preserveAspectRatio="xMidYMid meet"/>
  <text class="ui body" x="414" y="494">Six symmetric modules. Three pastel pairs.</text>
  <text class="ui body" x="414" y="524">Graphite owner core. No baked tile.</text>
  <rect x="414" y="552" width="116" height="40" rx="20" fill="#f3efe9"/>
  <text class="ui tiny" x="472" y="578" text-anchor="middle">LIGHT</text>
  <rect x="540" y="552" width="128" height="40" rx="20" fill="#20232e"/>
  <text class="ui tiny" x="604" y="578" text-anchor="middle" fill="#f8f5ef">DARK</text>

  <g filter="url(#shadow)">
    <rect class="panel" x="808" y="216" width="720" height="420" rx="36"/>
  </g>
  <text class="ui eyebrow" x="848" y="262">OPTICAL SMALL-SIZE LADDER</text>
  <line class="hair" x1="848" y1="514" x2="1488" y2="514"/>
  <g class="ui" text-anchor="middle">
    <g transform="translate(894 308)"><image width="40" height="40" xlink:href="day-compass-transparent-512.png"/><text class="tiny" x="20" y="78">16 px</text></g>
    <g transform="translate(1002 298)"><image width="56" height="56" xlink:href="day-compass-transparent-512.png"/><text class="tiny" x="28" y="88">24 px</text></g>
    <g transform="translate(1128 286)"><image width="76" height="76" xlink:href="day-compass-transparent-512.png"/><text class="tiny" x="38" y="100">32 px</text></g>
    <g transform="translate(1276 268)"><image width="112" height="112" xlink:href="day-compass-transparent-512.png"/><text class="tiny" x="56" y="120">48 px</text></g>
    <g transform="translate(1418 256)"><image width="128" height="128" x="-16" xlink:href="day-compass-transparent-512.png"/><text class="tiny" x="48" y="132">96 px</text></g>
  </g>
  <text class="ui label" x="848" y="558">Reject if modules fuse, clip, lose symmetry, or gain a white/black tile.</text>
  <text class="ui body" x="848" y="590">Android masks own the outer field. Windows uses optical ICO corrections.</text>

  <g filter="url(#smallShadow)"><rect class="panel" x="72" y="674" width="456" height="250" rx="30"/></g>
  <text class="ui eyebrow" x="108" y="720">SEMANTIC PASTEL</text>
  <g transform="translate(108 756)" text-anchor="middle">
    <rect width="84" height="84" rx="25" fill="url(#apricot)"/><text class="ui label" x="42" y="122">Intention</text><text class="ui tiny" x="42" y="146">Plan · next</text>
    <rect x="106" width="84" height="84" rx="25" fill="url(#mint)"/><text class="ui label" x="148" y="122">Rhythm</text><text class="ui tiny" x="148" y="146">Habit · saved</text>
    <rect x="212" width="84" height="84" rx="25" fill="url(#lavender)"/><text class="ui label" x="254" y="122">Reflection</text><text class="ui tiny" x="254" y="146">Focus · AI</text>
    <rect x="318" width="84" height="84" rx="25" fill="url(#graphite)"/><text class="ui label" x="360" y="122">Owner core</text><text class="ui tiny" x="360" y="146">Type · control</text>
  </g>

  <g filter="url(#smallShadow)"><rect class="panel" x="558" y="674" width="470" height="250" rx="30"/></g>
  <text class="ui eyebrow" x="594" y="720">SYSTEM STATUS — INDEPENDENT</text>
  <g class="ui" transform="translate(594 762)">
    <circle cx="16" cy="16" r="10" fill="#2aa66f"/><text class="label" x="40" y="22">Synced</text><text class="tiny" x="40" y="48">green + cloud + label</text>
    <circle cx="16" cy="88" r="10" fill="#d99b24"/><text class="label" x="40" y="94">Syncing / Retrying</text><text class="tiny" x="40" y="120">yellow + motion + label</text>
    <circle cx="252" cy="16" r="10" fill="#d85252"/><text class="label" x="276" y="22">Needs attention</text><text class="tiny" x="276" y="48">red + detail route</text>
    <circle cx="252" cy="88" r="10" fill="#777184"/><text class="label" x="276" y="94">Offline</text><text class="tiny" x="276" y="120">local work stays usable</text>
  </g>

  <g filter="url(#smallShadow)"><rect class="darkPanel" x="1058" y="674" width="470" height="250" rx="30"/></g>
  <text class="ui eyebrow" x="1094" y="720" fill="#9f98ad">DARK EXPRESSION</text>
  <image x="1094" y="754" width="242" height="90" xlink:href="perfect-wordmark-dark.png" preserveAspectRatio="xMinYMid meet"/>
  <image x="1368" y="746" width="104" height="104" xlink:href="day-compass-transparent-512.png"/>
  <text class="ui body" x="1094" y="864" style="fill:#ded9e8">Warm graphite · raised edges · no pure black</text>
  <text class="ui tiny" x="1094" y="894" style="fill:#aba4b8">High contrast replaces blur with solid system-safe surfaces.</text>
</svg>
