<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1600" height="1000" viewBox="0 0 1600 1000">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#fffdf9"/><stop offset="1" stop-color="#f6efe8"/></linearGradient>
    <linearGradient id="glass" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#fff" stop-opacity=".92"/><stop offset="1" stop-color="#f4efff" stop-opacity=".72"/></linearGradient>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="160%"><feDropShadow dx="0" dy="10" stdDeviation="15" flood-color="#382f28" flood-opacity=".11"/></filter>
    <style>
      .ui{font-family:"Segoe UI",Arial,sans-serif;fill:#202332}.eyebrow{font-size:13px;font-weight:750;letter-spacing:1.7px;fill:#897d70}.title{font-size:42px;font-weight:750;letter-spacing:-1.2px}.h2{font-size:22px;font-weight:720}.h3{font-size:16px;font-weight:680}.body{font-size:15px;fill:#625d70}.tiny{font-size:12px;fill:#777184}.panel{fill:#fffefa;stroke:#e6ddd3;stroke-width:1.2}.rule{stroke:#e4ddd4;stroke-width:1}.mono{font-variant-numeric:tabular-nums}
    </style>
  </defs>
  <rect width="1600" height="1000" fill="url(#bg)"/>
  <text class="ui eyebrow" x="58" y="58">PS01 · STATE PLATE</text>
  <text class="ui title" x="58" y="108">Every state names the truth and preserves the work.</text>
  <text class="ui body" x="58" y="142">Color supports meaning; it never carries meaning alone. Local-first remains usable through retry, conflict and provider failure.</text>

  <!-- SYNC -->
  <g transform="translate(58 184)">
    <rect class="panel" width="1484" height="156" rx="32" filter="url(#shadow)"/>
    <text class="ui eyebrow" x="28" y="40">SYNC CLOUD — STABLE GEOMETRY</text>
    <g class="ui" transform="translate(28 66)">
      <g><rect width="330" height="62" rx="24" fill="#e8f7ef" stroke="#a8dfc4"/><path d="M26 39h28c8 0 13-5 13-12s-5-12-13-12c-3-7-9-10-17-10-10 0-18 7-19 17-8 1-13 6-13 13 0 8 7 14 21 14" transform="scale(.58) translate(18 10)" fill="none" stroke="#2aa66f" stroke-width="3"/><text class="h3" x="66" y="29" fill="#247a56">Synced</text><text class="tiny" x="66" y="48">All local changes are on Supabase</text></g>
      <g transform="translate(350)"><rect width="330" height="62" rx="24" fill="#fff7df" stroke="#ead18c"/><circle cx="30" cy="31" r="13" fill="none" stroke="#d99b24" stroke-width="3" stroke-dasharray="50 20"/><text class="h3" x="58" y="29" fill="#9a6b12">Syncing</text><text class="tiny" x="58" y="48">2 local changes · background work</text></g>
      <g transform="translate(700)"><rect width="330" height="62" rx="24" fill="#fff3df" stroke="#e8c378"/><path d="M18 38l12-22 12 22z" fill="none" stroke="#c38313" stroke-width="2.5"/><text class="h3" x="58" y="29" fill="#965f08">Retrying</text><text class="tiny" x="58" y="48">Next attempt in 18s · work is safe</text></g>
      <g transform="translate(1050)"><rect width="378" height="62" rx="24" fill="#fff0ef" stroke="#e8aaa5"/><circle cx="30" cy="31" r="14" fill="none" stroke="#d85252" stroke-width="2.5"/><path d="M30 22v11M30 39v1" stroke="#d85252" stroke-width="2.5" stroke-linecap="round"/><text class="h3" x="58" y="29" fill="#ad3434">Sync needs attention</text><text class="tiny" x="58" y="48">Local work available · open details</text></g>
    </g>
  </g>

  <!-- TASK STATUS -->
  <g transform="translate(58 370)">
    <rect class="panel" width="720" height="254" rx="32" filter="url(#shadow)"/>
    <text class="ui eyebrow" x="28" y="40">TASK OUTCOME CYCLE — ONE OUTER GEOMETRY</text>
    <g class="ui" text-anchor="middle" transform="translate(40 78)">
      <g transform="translate(48 0)"><circle cx="0" cy="34" r="25" fill="#fff" stroke="#aaa3ae" stroke-width="3"/><text class="h3" y="82">Empty</text><text class="tiny" y="104">not logged</text></g>
      <g transform="translate(170 0)"><circle cx="0" cy="34" r="25" fill="#fff8e8" stroke="#d99b24" stroke-width="3"/><circle cx="0" cy="34" r="7" fill="#d99b24"/><text class="h3" y="82">Pending</text><text class="tiny" y="104">still actionable</text></g>
      <g transform="translate(292 0)"><circle cx="0" cy="34" r="25" fill="#fff" stroke="#a790e0" stroke-width="4" stroke-dasharray="95 62"/><text class="h3" y="82">Partial</text><text class="tiny" y="104">arc + semantics</text></g>
      <g transform="translate(414 0)"><circle cx="0" cy="34" r="25" fill="#68bf9d"/><path d="M-10 34l7 8 15-18" fill="none" stroke="#fff" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/><text class="h3" y="82">Done</text><text class="tiny" y="104">reversible</text></g>
      <g transform="translate(536 0)"><circle cx="0" cy="34" r="25" fill="#fff1ef" stroke="#d85252" stroke-width="3"/><path d="M-8 26l16 16M8 26L-8 42" stroke="#d85252" stroke-width="3" stroke-linecap="round"/><text class="h3" y="82">Missed</text><text class="tiny" y="104">explicit truth</text></g>
    </g>
    <rect x="28" y="204" width="664" height="28" rx="13" fill="#f5f1ed"/><text class="ui tiny" x="42" y="223">Tap cycles configured common outcomes · long press/menu chooses exact state · Undo receipt restores prior value</text>
  </g>

  <!-- INTERACTION STATES -->
  <g transform="translate(808 370)">
    <rect class="panel" width="734" height="254" rx="32" filter="url(#shadow)"/>
    <text class="ui eyebrow" x="28" y="40">CONTROL STATES — TOUCH + MOUSE + KEYBOARD</text>
    <g class="ui" transform="translate(28 76)">
      <g><rect width="120" height="48" rx="18" fill="#2e3341"/><text class="h3" x="60" y="30" text-anchor="middle" fill="#fff">Default</text></g>
      <g transform="translate(134)"><rect width="120" height="48" rx="18" fill="#3a4050"/><text class="h3" x="60" y="30" text-anchor="middle" fill="#fff">Hover</text></g>
      <g transform="translate(268)"><rect x="-3" y="-3" width="126" height="54" rx="21" fill="none" stroke="#7560c5" stroke-width="3"/><rect width="120" height="48" rx="18" fill="#2e3341"/><text class="h3" x="60" y="30" text-anchor="middle" fill="#fff">Focus</text></g>
      <g transform="translate(402)"><rect y="3" width="120" height="45" rx="18" fill="#171a22"/><text class="h3" x="60" y="31" text-anchor="middle" fill="#fff">Pressed</text></g>
      <g transform="translate(536)"><rect width="142" height="48" rx="18" fill="#ece8e2"/><text class="h3" x="71" y="30" text-anchor="middle" fill="#aaa3ae">Disabled</text></g>
    </g>
    <g class="ui" transform="translate(28 154)">
      <rect width="310" height="56" rx="18" fill="#fff" stroke="#cfc5bb"/><text class="body" x="18" y="24">Capture a task…</text><text class="tiny" x="18" y="44">Idle — no automatic keyboard</text>
      <rect x="330" width="376" height="56" rx="18" fill="#fff" stroke="#7560c5" stroke-width="2.5"/><foreignObject x="348" y="7" width="330" height="24"><div xmlns="http://www.w3.org/1999/xhtml" dir="rtl" style="font:15px 'Segoe UI','Vazirmatn',Tahoma,sans-serif;color:#625d70;text-align:left;white-space:nowrap">مرور فصل <span dir="ltr">Arrhythmia</span></div></foreignObject><text class="tiny" x="348" y="44">Focused — IME requested by direct tap</text>
    </g>
  </g>

  <!-- RECOVERY SURFACES -->
  <g transform="translate(58 654)">
    <rect class="panel" width="1484" height="286" rx="32" filter="url(#shadow)"/>
    <text class="ui eyebrow" x="28" y="40">EMPTY · OFFLINE · CONFLICT · PROVIDER ERROR — NO DATA RESET, NO DEMO ENTITIES</text>
    <g class="ui" transform="translate(28 70)">
      <g><rect width="330" height="184" rx="24" fill="#fbfaf7" stroke="#e4ddd4"/><image x="22" y="22" width="44" height="44" xlink:href="day-compass-transparent-512.png"/><text class="h2" x="22" y="92">Nothing planned yet</text><text class="body" x="22" y="119">Start with one real intention.</text><rect x="22" y="138" width="118" height="34" rx="15" fill="#2e3341"/><text class="h3" x="81" y="161" text-anchor="middle" fill="#fff">Capture</text><rect x="150" y="138" width="158" height="34" rx="15" fill="#eee8ff"/><text class="h3" x="229" y="161" text-anchor="middle" fill="#6750b4">Plan with Perfect AI</text></g>
      <g transform="translate(350)"><rect width="330" height="184" rx="24" fill="#fff8e8" stroke="#ead18c"/><text class="h2" x="22" y="42">Offline</text><text class="body" x="22" y="70">2 local changes are safe.</text><text class="tiny" x="22" y="96">Keep working. Sync resumes automatically.</text><rect x="22" y="124" width="122" height="38" rx="16" fill="#fff" stroke="#d8c188"/><text class="h3" x="83" y="149" text-anchor="middle">View queue</text></g>
      <g transform="translate(700)"><rect width="352" height="184" rx="24" fill="#fff4f2" stroke="#e8aaa5"/><text class="h2" x="22" y="42">Resolve conflict</text><text class="tiny" x="22" y="68">Notes · Cardiology deep work</text><rect x="22" y="84" width="142" height="42" rx="14" fill="#f1eaff"/><text class="tiny" x="34" y="104">Your version</text><text class="tiny" x="34" y="120">Review after lunch</text><rect x="176" y="84" width="154" height="42" rx="14" fill="#e4f5ed"/><text class="tiny" x="188" y="104">Remote version</text><text class="tiny" x="188" y="120">Review this evening</text><rect x="22" y="140" width="142" height="32" rx="14" fill="#a790e0"/><text class="h3" x="93" y="162" text-anchor="middle" fill="#fff">Keep local</text><rect x="176" y="140" width="154" height="32" rx="14" fill="#68bf9d"/><text class="h3" x="253" y="162" text-anchor="middle" fill="#fff">Use remote</text></g>
      <g transform="translate(1072)"><rect width="356" height="184" rx="24" fill="#fff0ef" stroke="#e8aaa5"/><text class="h2" x="22" y="42">Perfect AI is unavailable</text><text class="body" x="22" y="70">Your planner and drafts are safe.</text><text class="tiny" x="22" y="96">Provider timeout · no planner write occurred</text><rect x="22" y="126" width="104" height="38" rx="16" fill="#2e3341"/><text class="h3" x="74" y="151" text-anchor="middle" fill="#fff">Try again</text><rect x="136" y="126" width="126" height="38" rx="16" fill="#fff" stroke="#cfc5bb"/><text class="h3" x="199" y="151" text-anchor="middle">Keep draft</text></g>
    </g>
  </g>
</svg>
