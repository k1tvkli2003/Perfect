        <text x="432" y="348" font-family="Arial, sans-serif" font-size="13" font-weight="600" fill="#686579"><tspan x="432" dy="0">Both states are bounded and interruptible.</tspan></text>
      </g>
      <g>
        <text x="806" y="180" font-family="Arial, sans-serif" font-size="12" font-weight="800" letter-spacing="1.3" fill="#7F68C9">END 100%</text>

    <rect x="806" y="198" width="330" height="122" rx="22" fill="#FFFDF9" stroke="#ECE5DC"/>
    <rect x="824" y="220" width="118" height="78" rx="17" fill="#F7F2EB" opacity="0.24"/>
