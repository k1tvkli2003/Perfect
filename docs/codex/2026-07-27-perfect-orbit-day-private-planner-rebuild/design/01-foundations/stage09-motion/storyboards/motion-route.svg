    <rect x="54" y="52" width="48" height="48" rx="16" fill="#FFEAD7"/><path d="M68 72h20M68 79h20" stroke="#A4510E" stroke-width="3" stroke-linecap="round"/>
    <text x="118" y="67" font-family="Arial, sans-serif" font-size="11" font-weight="800" letter-spacing="1.5" fill="#7F68C9">PERFECT! MOTION · motion-route</text>
    <text x="118" y="98" font-family="Arial, sans-serif" font-size="30" font-weight="800" fill="#1D2030">Route hand-off</text>
    <text x="54" y="139" font-family="Arial, sans-serif" font-size="15" font-weight="600" fill="#686579"><tspan x="54" dy="0">Destination order remains legible while retained route state stays</tspan><tspan x="54" dy="20">offstage.</tspan></text>
    <rect x="760" y="50" width="380" height="104" rx="22" fill="#FFFCF7" stroke="#ECE5DC"/>
    <text x="782" y="76" font-family="Arial, sans-serif" font-size="11" font-weight="800" letter-spacing="1.1" fill="#A4510E">ROUTE · 380MS / 240MS REVERSE</text>
    <text x="782" y="101" font-family="Arial, sans-serif" font-size="13" font-weight="700" fill="#1D2030"><tspan x="782" dy="0">Navigator routes travel 14px; workspace</tspan><tspan x="782" dy="18">hand-offs use one isolated 8px edge cue</tspan></text>

      <g>
        <text x="54" y="180" font-family="Arial, sans-serif" font-size="12" font-weight="800" letter-spacing="1.3" fill="#7F68C9">FIRST 0%</text>

    <rect x="54" y="198" width="330" height="122" rx="22" fill="#FFFDF9" stroke="#ECE5DC"/>
