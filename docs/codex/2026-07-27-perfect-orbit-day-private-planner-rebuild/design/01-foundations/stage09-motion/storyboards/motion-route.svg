        <text x="432" y="574" font-family="Arial, sans-serif" font-size="13" font-weight="600" fill="#686579"><tspan x="432" dy="0">Retarget to the latest request; never</tspan><tspan x="432" dy="17">replay.</tspan></text>
      </g>
      <g>
        <text x="806" y="406" font-family="Arial, sans-serif" font-size="12" font-weight="800" letter-spacing="1.3" fill="#7F68C9">REDUCED</text>

