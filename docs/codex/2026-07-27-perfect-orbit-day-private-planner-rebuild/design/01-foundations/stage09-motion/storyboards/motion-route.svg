        <text x="56" y="574" font-family="Arial, sans-serif" font-size="13" font-weight="600" fill="#686579"><tspan x="56" dy="0">Continue from the current interpolated</tspan><tspan x="56" dy="17">value.</tspan></text>
      </g>
      <g>
        <text x="430" y="406" font-family="Arial, sans-serif" font-size="12" font-weight="800" letter-spacing="1.3" fill="#7F68C9">INTERRUPTED</text>

