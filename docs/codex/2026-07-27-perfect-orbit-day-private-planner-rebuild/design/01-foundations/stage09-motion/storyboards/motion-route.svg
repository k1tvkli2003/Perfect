        <text x="808" y="348" font-family="Arial, sans-serif" font-size="13" font-weight="600" fill="#686579"><tspan x="808" dy="0">Final state is usable and announced once.</tspan></text>
      </g>
      <g>
        <text x="54" y="406" font-family="Arial, sans-serif" font-size="12" font-weight="800" letter-spacing="1.3" fill="#7F68C9">REVERSE</text>

    <rect x="54" y="424" width="330" height="122" rx="22" fill="#FFFDF9" stroke="#ECE5DC"/>
