    <rect x="824" y="446" width="118" height="78" rx="17" fill="#F7F2EB" opacity="0.43999999999999995"/>
    <rect x="856" y="442" width="244" height="86" rx="20" fill="#A79ADD" opacity="0.42140000000000005"/>
    <circle cx="884" cy="471" r="13" fill="#A79ADD" opacity="0.98"/>
    <rect x="908" y="459" width="144" height="10" rx="5" fill="#1D2030" opacity="0.8999999999999999"/>
    <rect x="908" y="480" width="106" height="8" rx="4" fill="#686579" opacity="0.72"/>
    <rect x="908" y="500" width="64" height="7" rx="3.5" fill="#A79ADD" opacity="0.88"/>

    <path d="M 1090 511 h 24" stroke="#1D2030" stroke-width="3" stroke-linecap="round"/><path d="M 1096 504 l 12 14" stroke="#1D2030" stroke-width="2"/>

        <text x="808" y="574" font-family="Arial, sans-serif" font-size="13" font-weight="600" fill="#686579"><tspan x="808" dy="0">No spatial travel; information stays equal.</tspan></text>
      </g>
    <line x1="54" y1="626" x2="1140" y2="626" stroke="#ECE5DC"/>
    <text x="54" y="650" font-family="Arial, sans-serif" font-size="12" font-weight="700" fill="#1D2030"><tspan x="54" dy="0">FOCUS · Destination owns focus only after it exists; outgoing route is inert</tspan><tspan x="54" dy="16">immediately.</tspan></text>
    <text x="640" y="650" font-family="Arial, sans-serif" font-size="12" font-weight="700" fill="#1D2030"><tspan x="640" dy="0">BUDGET · Only the selected route paints; the isolated edge cue</tspan><tspan x="640" dy="16">never revives an offstage route.</tspan></text>
  </svg>