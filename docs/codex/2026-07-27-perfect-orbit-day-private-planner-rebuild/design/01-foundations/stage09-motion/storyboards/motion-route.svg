        <text x="56" y="348" font-family="Arial, sans-serif" font-size="13" font-weight="600" fill="#686579"><tspan x="56" dy="0">Prior geometry remains authoritative.</tspan></text>
      </g>
      <g>
        <text x="430" y="180" font-family="Arial, sans-serif" font-size="12" font-weight="800" letter-spacing="1.3" fill="#7F68C9">MID 50%</text>

    <rect x="430" y="198" width="330" height="122" rx="22" fill="#FFFDF9" stroke="#ECE5DC"/>
