name: Perfect private CI

run-name: "Private CI · ${{ github.event_name }} · ${{ github.ref_name }} · #${{ github.run_number }}"

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  actions: read
  contents: read

# Trusted main/manual-main runs publish a private, installable GitHub Release.
# Pull requests remain unprivileged verification only. Monotonic platform
# versions must queue instead of cancelling one another.
concurrency:
  group: perfect-private-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false
  queue: max

jobs:
  prepare:
    name: Allocate private build identity
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      semantic_version: ${{ steps.version.outputs.semantic_version }}
      android_version_code: ${{ steps.version.outputs.android_version_code }}
      msix_version: ${{ steps.version.outputs.msix_version }}
      artifact_version: ${{ steps.version.outputs.artifact_version }}
      release_tag: ${{ steps.version.outputs.release_tag }}
      trusted_build: ${{ steps.version.outputs.trusted_build }}
    steps:
      - name: Check out source
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          fetch-depth: 0
      - name: Calculate deterministic platform versions
        id: version
        shell: bash
        env:
          PERFECT_RUN_NUMBER: ${{ github.run_number }}
          PERFECT_TRUSTED_BUILD: ${{ (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/main' }}
          PERFECT_BASE_SHA: ${{ github.event.before || github.event.pull_request.base.sha || '' }}
        run: |
          version_line="$(grep -E '^version:[[:space:]]*[0-9]+\.[0-9]+\.[0-9]+(\+[0-9]+)?[[:space:]]*$' pubspec.yaml | head -n 1 || true)"
          if [[ ! "$version_line" =~ ^version:[[:space:]]*([0-9]+)\.([0-9]+)\.([0-9]+)(\+([0-9]+))?[[:space:]]*$ ]]; then
            echo "::error::pubspec.yaml must contain version MAJOR.MINOR.PATCH+BUILD."
            exit 1
          fi

          major="${BASH_REMATCH[1]}"
          minor="${BASH_REMATCH[2]}"
          patch="${BASH_REMATCH[3]}"
          # BUILD is a checked-in Android epoch/base, not the final package
          # number. Adding the deterministic workflow run keeps reruns stable
          # while allowing a deliberate epoch bump above any private/local
          # artifacts already installed on the owner's devices.
          android_epoch="${BASH_REMATCH[5]:-0}"
          run_number="$PERFECT_RUN_NUMBER"

          comparison_ref="${PERFECT_BASE_SHA:-HEAD^}"
          previous_version_line="$(git show "$comparison_ref":pubspec.yaml 2>/dev/null | grep -E '^version:[[:space:]]*[0-9]+\.[0-9]+\.[0-9]+(\+[0-9]+)?[[:space:]]*$' | head -n 1 || true)"
          if [[ -n "$previous_version_line" && "$previous_version_line" =~ ^version:[[:space:]]*([0-9]+)\.([0-9]+)\.([0-9]+)(\+([0-9]+))? ]]; then
            previous_major="${BASH_REMATCH[1]}"
            previous_minor="${BASH_REMATCH[2]}"
            previous_patch="${BASH_REMATCH[3]}"
            previous_android_epoch="${BASH_REMATCH[5]:-0}"
            if (( major < previous_major \
              || (major == previous_major && minor < previous_minor) \
              || (major == previous_major && minor == previous_minor && patch < previous_patch) )); then
              echo "::error::pubspec semantic version $major.$minor.$patch regresses from $previous_major.$previous_minor.$previous_patch and would break MSIX install-over continuity."
              exit 1
            fi
            if (( android_epoch < previous_android_epoch )); then
              echo "::error::pubspec Android epoch $android_epoch regresses from $previous_android_epoch and would break APK install-over continuity."
              exit 1
            fi
          fi

          if (( android_epoch < 1 || run_number < 1 || run_number > 65535 )); then
            echo "::error::The Android epoch and GitHub run number must be positive; the run number must fit the MSIX revision."
            exit 1
          fi
          android_version_code=$((android_epoch + run_number))
          if (( android_version_code <= android_epoch || android_version_code > 2100000000 )); then
            echo "::error::Computed Android versionCode $android_version_code is outside the safe monotonic range."
            exit 1
          fi
          if (( major > 65535 || minor > 65535 || patch > 65535 )); then
            echo "::error::The computed MSIX version exceeds a 16-bit component."
            exit 1
          fi

          semantic_version="$major.$minor.$patch"
          artifact_version="$semantic_version-build.$android_version_code"
          {
            echo "semantic_version=$semantic_version"
            echo "android_version_code=$android_version_code"
            echo "msix_version=$semantic_version.$run_number"
            echo "artifact_version=$artifact_version"
            echo "release_tag=v$artifact_version"
            echo "trusted_build=${PERFECT_TRUSTED_BUILD,,}"
          } >> "$GITHUB_OUTPUT"

  quality-and-android:
    name: Quality and Android
    needs: prepare
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Check out source
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
      - name: Set up Java 17
        uses: actions/setup-java@dded0888837ed1f317902acf8a20df0ad188d165 # v5.0.0
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          flutter-version: 3.44.0
          channel: stable
          cache: true
      - name: Resolve locked dependencies
        run: flutter pub get --enforce-lockfile
      - name: Check formatting
        run: dart format --output=none --set-exit-if-changed lib test
      - name: Analyze
        run: flutter analyze
      - name: Test
        # The approved PNG baselines were frozen on Windows. Skia/font
        # rasterization differs by host OS, so Linux verifies every behavioral
        # test while the Windows job owns exact pixel comparison.
        run: flutter test --exclude-tags windows-golden
      - name: Restore private Android signing identity
        id: android-signing
        shell: bash
        env:
          PERFECT_TRUSTED_BUILD: ${{ needs.prepare.outputs.trusted_build }}
          PERFECT_ANDROID_KEYSTORE_BASE64: ${{ needs.prepare.outputs.trusted_build == 'true' && secrets.PERFECT_ANDROID_KEYSTORE_BASE64 || '' }}
          PERFECT_ANDROID_KEYSTORE_PASSWORD: ${{ needs.prepare.outputs.trusted_build == 'true' && secrets.PERFECT_ANDROID_KEYSTORE_PASSWORD || '' }}
          PERFECT_ANDROID_KEY_ALIAS: ${{ needs.prepare.outputs.trusted_build == 'true' && secrets.PERFECT_ANDROID_KEY_ALIAS || '' }}
          PERFECT_ANDROID_KEY_PASSWORD: ${{ needs.prepare.outputs.trusted_build == 'true' && secrets.PERFECT_ANDROID_KEY_PASSWORD || '' }}
          PERFECT_ANDROID_CERT_SHA256: ${{ needs.prepare.outputs.trusted_build == 'true' && vars.PERFECT_ANDROID_CERT_SHA256 || '' }}
        run: |
          if [[ "$PERFECT_TRUSTED_BUILD" != "true" ]]; then
            echo "mode=debug-fallback" >> "$GITHUB_OUTPUT"
            echo "::notice::Untrusted/PR build: Android signing secrets were not exposed."
            exit 0
          fi

          missing=()
          for name in \
            PERFECT_ANDROID_KEYSTORE_BASE64 \
            PERFECT_ANDROID_KEYSTORE_PASSWORD \
            PERFECT_ANDROID_KEY_ALIAS \
            PERFECT_ANDROID_KEY_PASSWORD \
            PERFECT_ANDROID_CERT_SHA256; do
            if [[ -z "${!name}" ]]; then
              missing+=("$name")
            fi
          done
          if (( ${#missing[@]} > 0 )); then
            echo "::error::Trusted Android builds require the complete stable signing contract. Missing: ${missing[*]}"
            exit 1
          fi

          key_path="$RUNNER_TEMP/perfect-private.jks"
          cert_path="$RUNNER_TEMP/perfect-private-android.cer"
          printf '%s' "$PERFECT_ANDROID_KEYSTORE_BASE64" | base64 --decode > "$key_path"
          chmod 600 "$key_path"
          export PERFECT_ANDROID_KEYSTORE_PASSWORD
          keytool -exportcert \
            -keystore "$key_path" \
            -storepass:env PERFECT_ANDROID_KEYSTORE_PASSWORD \
            -alias "$PERFECT_ANDROID_KEY_ALIAS" \
            -file "$cert_path"

          actual_fingerprint="$(sha256sum "$cert_path" | awk '{print toupper($1)}')"
          expected_fingerprint="$(printf '%s' "$PERFECT_ANDROID_CERT_SHA256" | tr -d '[:space:]:' | tr '[:lower:]' '[:upper:]')"
          if [[ "$actual_fingerprint" != "$expected_fingerprint" ]]; then
            echo "::error::The Android signing certificate does not match PERFECT_ANDROID_CERT_SHA256."
            exit 1
          fi
          echo "mode=stable-private" >> "$GITHUB_OUTPUT"
      - name: Build private Android APK
        id: android-build
        shell: bash
        env:
          PERFECT_SUPABASE_URL: ${{ needs.prepare.outputs.trusted_build == 'true' && secrets.PERFECT_SUPABASE_URL || '' }}
          PERFECT_SUPABASE_PUBLISHABLE_KEY: ${{ needs.prepare.outputs.trusted_build == 'true' && secrets.PERFECT_SUPABASE_PUBLISHABLE_KEY || '' }}
          PERFECT_SEMANTIC_VERSION: ${{ needs.prepare.outputs.semantic_version }}
          PERFECT_ANDROID_VERSION_CODE: ${{ needs.prepare.outputs.android_version_code }}
          PERFECT_ANDROID_KEYSTORE_PATH: ${{ needs.prepare.outputs.trusted_build == 'true' && format('{0}/perfect-private.jks', runner.temp) || '' }}
          PERFECT_ANDROID_KEYSTORE_PASSWORD: ${{ needs.prepare.outputs.trusted_build == 'true' && secrets.PERFECT_ANDROID_KEYSTORE_PASSWORD || '' }}
          PERFECT_ANDROID_KEY_ALIAS: ${{ needs.prepare.outputs.trusted_build == 'true' && secrets.PERFECT_ANDROID_KEY_ALIAS || '' }}
          PERFECT_ANDROID_KEY_PASSWORD: ${{ needs.prepare.outputs.trusted_build == 'true' && secrets.PERFECT_ANDROID_KEY_PASSWORD || '' }}
        run: |
          if [[ -n "$PERFECT_SUPABASE_URL" && -n "$PERFECT_SUPABASE_PUBLISHABLE_KEY" ]]; then
            flutter build apk --release \
              --build-name="$PERFECT_SEMANTIC_VERSION" \
              --build-number="$PERFECT_ANDROID_VERSION_CODE" \
              --dart-define="SUPABASE_URL=$PERFECT_SUPABASE_URL" \
              --dart-define="SUPABASE_PUBLISHABLE_KEY=$PERFECT_SUPABASE_PUBLISHABLE_KEY" \
              --dart-define="SUPABASE_AUTH_REDIRECT_URI=perfect://login-callback"
            echo "mode=configured-private" >> "$GITHUB_OUTPUT"
          else
            flutter build apk --release \
              --build-name="$PERFECT_SEMANTIC_VERSION" \
              --build-number="$PERFECT_ANDROID_VERSION_CODE"
            echo "mode=verification-only-unconfigured" >> "$GITHUB_OUTPUT"
            echo "::warning::Supabase repository secrets are absent. This artifact verifies compilation but opens the configuration screen and is not a sync-ready install."
          fi
      - name: Verify and checksum Android package
        id: android-package
        shell: bash
        env:
          PERFECT_TRUSTED_BUILD: ${{ needs.prepare.outputs.trusted_build }}
          PERFECT_SEMANTIC_VERSION: ${{ needs.prepare.outputs.semantic_version }}
          PERFECT_ANDROID_VERSION_CODE: ${{ needs.prepare.outputs.android_version_code }}
          PERFECT_ARTIFACT_VERSION: ${{ needs.prepare.outputs.artifact_version }}
          PERFECT_ANDROID_CERT_SHA256: ${{ needs.prepare.outputs.trusted_build == 'true' && vars.PERFECT_ANDROID_CERT_SHA256 || '' }}
        run: |
          source_apk="build/app/outputs/flutter-apk/app-release.apk"
          package_dir="build/private-artifacts/android"
          package_apk="$package_dir/perfect-$PERFECT_ARTIFACT_VERSION-android-universal.apk"
          mkdir -p "$package_dir"

          build_tools="$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -n 1)"
          if [[ -z "$build_tools" ]]; then
            echo "::error::Android SDK build-tools were not found."
            exit 1
          fi
          "$build_tools/zipalign" -c -P 16 -v 4 "$source_apk"
          signer_output="$("$build_tools/apksigner" verify --verbose --print-certs "$source_apk")"
          printf '%s\n' "$signer_output"

          badging="$("$build_tools/aapt2" dump badging "$source_apk" | sed -n '1p')"
          if [[ "$badging" != *"package: name='com.k1tvkli2003.perfect'"* \
            || "$badging" != *"versionCode='$PERFECT_ANDROID_VERSION_CODE'"* \
            || "$badging" != *"versionName='$PERFECT_SEMANTIC_VERSION'"* ]]; then
            echo "::error::Android package identity or version drifted: $badging"
            exit 1
          fi

          unzip -Z1 "$source_apk" > "$RUNNER_TEMP/perfect-apk-contents.txt"
          for abi in arm64-v8a armeabi-v7a x86_64; do
            if ! grep -q "^lib/$abi/libapp\\.so$" "$RUNNER_TEMP/perfect-apk-contents.txt"; then
              echo "::error::The universal APK is missing Flutter runtime $abi."
              exit 1
            fi
          done

          if [[ "$PERFECT_TRUSTED_BUILD" == "true" ]]; then
            actual_fingerprint="$(printf '%s\n' "$signer_output" | sed -n 's/^.*certificate SHA-256 digest: //p' | head -n 1 | tr -d '[:space:]:' | tr '[:lower:]' '[:upper:]')"
            expected_fingerprint="$(printf '%s' "$PERFECT_ANDROID_CERT_SHA256" | tr -d '[:space:]:' | tr '[:lower:]' '[:upper:]')"
            if [[ -z "$actual_fingerprint" || "$actual_fingerprint" != "$expected_fingerprint" ]]; then
              echo "::error::The final APK does not carry the pinned Android signing certificate."
              exit 1
            fi
          fi

          cp "$source_apk" "$package_apk"
          (
            cd "$package_dir"
            sha256sum "$(basename "$package_apk")" > SHA256SUMS.txt
            sha256sum --check SHA256SUMS.txt
          )
          echo "artifact_dir=$package_dir" >> "$GITHUB_OUTPUT"
      - name: Preserve private Android build
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: perfect-${{ needs.prepare.outputs.artifact_version }}-android-${{ steps.android-signing.outputs.mode }}-${{ steps.android-build.outputs.mode }}
          path: ${{ steps.android-package.outputs.artifact_dir }}
          if-no-files-found: error
          retention-days: 14
      - name: Remove restored Android signing files
        if: always()
        shell: bash
        run: |
          rm -f \
            "$RUNNER_TEMP/perfect-private.jks" \
            "$RUNNER_TEMP/perfect-private-android.cer"

  windows:
    name: Windows desktop build
    needs: prepare
    runs-on: windows-2025
    timeout-minutes: 25
    steps:
      - name: Check out source
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
      - name: Set up Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          flutter-version: 3.44.0
          channel: stable
          cache: true
      - name: Resolve locked dependencies
        run: flutter pub get --enforce-lockfile
      - name: Install pinned official Inno Setup compiler
        shell: pwsh
        env:
          PERFECT_INNO_VERSION: 7.0.2
          PERFECT_INNO_INSTALLER_SHA256: 5AD54CA3DEF786F8F4212552E54CC6D8D61329E2D24A1CFEE0571D42C2684FF1
        run: |
          $ErrorActionPreference = 'Stop'
          $installer = Join-Path `
            $env:RUNNER_TEMP `
            "innosetup-$env:PERFECT_INNO_VERSION-x64.exe"
          $installRoot = Join-Path `
            $env:RUNNER_TEMP `
            "inno-$env:PERFECT_INNO_VERSION"
          $uri = (
            'https://github.com/jrsoftware/issrc/releases/download/' +
            'is-7_0_2/innosetup-7.0.2-x64.exe'
          )
          Invoke-WebRequest -Uri $uri -OutFile $installer
          $actualHash = (
            Get-FileHash -Algorithm SHA256 -LiteralPath $installer
          ).Hash
          if ($actualHash -ne $env:PERFECT_INNO_INSTALLER_SHA256) {
            throw 'Downloaded Inno Setup installer failed its pinned SHA-256.'
          }
          $signature = Get-AuthenticodeSignature -FilePath $installer
          if (
            $signature.Status -ne
              [Management.Automation.SignatureStatus]::Valid -or
            -not $signature.SignerCertificate
          ) {
            throw 'Official Inno Setup installer signature is not valid.'
          }
          $process = Start-Process `
            -FilePath $installer `
            -ArgumentList @(
              '/VERYSILENT',
              '/SUPPRESSMSGBOXES',
              '/NORESTART',
              '/SP-',
              "/DIR=$installRoot"
            ) `
            -Wait `
            -PassThru `
            -WindowStyle Hidden
          if ($process.ExitCode -ne 0) {
            throw "Inno Setup compiler installation failed: $($process.ExitCode)."
          }
          $iscc = Join-Path $installRoot 'ISCC.exe'
          if (-not (Test-Path -LiteralPath $iscc -PathType Leaf)) {
            throw 'Pinned Inno Setup installation did not produce ISCC.exe.'
          }
          # Inno 7's compiler binaries deliberately carry a neutral 0.0.0.0
          # file version. The companion uninstaller preserves the signed
          # distribution's ProductVersion and is covered by the pinned
          # installer hash and Authenticode verification above.
          $versionCarrier = Join-Path $installRoot 'unins000.exe'
          if (-not (Test-Path -LiteralPath $versionCarrier -PathType Leaf)) {
            throw 'Pinned Inno Setup installation has no version carrier.'
          }
          $compilerVersion = (
            Get-Item -LiteralPath $versionCarrier
          ).VersionInfo.ProductVersion.Trim()
          if ($compilerVersion -cne $env:PERFECT_INNO_VERSION) {
            throw "Installed ISCC version drifted: $compilerVersion."
          }
          "PERFECT_ISCC_PATH=$iscc" | Out-File `
            -FilePath $env:GITHUB_ENV `
            -Encoding utf8 `
            -Append
          "PERFECT_ISCC_VERSION=$compilerVersion" | Out-File `
            -FilePath $env:GITHUB_ENV `
            -Encoding utf8 `
            -Append
          $installRoot | Out-File `
            -FilePath $env:GITHUB_PATH `
            -Encoding utf8 `
            -Append
      - name: Verify Windows installer source contract
        shell: pwsh
        run: ./tool/tests/test_windows_installer_contract.ps1
      - name: Verify Windows golden baselines
        run: flutter test --tags windows-golden
      - name: Build Windows desktop
        id: windows-build
        shell: pwsh
        env:
          PERFECT_SUPABASE_URL: ${{ needs.prepare.outputs.trusted_build == 'true' && secrets.PERFECT_SUPABASE_URL || '' }}
          PERFECT_SUPABASE_PUBLISHABLE_KEY: ${{ needs.prepare.outputs.trusted_build == 'true' && secrets.PERFECT_SUPABASE_PUBLISHABLE_KEY || '' }}
          PERFECT_SEMANTIC_VERSION: ${{ needs.prepare.outputs.semantic_version }}
          PERFECT_WINDOWS_BUILD_NUMBER: ${{ needs.prepare.outputs.android_version_code }}
        run: |
          if ($env:PERFECT_SUPABASE_URL -and $env:PERFECT_SUPABASE_PUBLISHABLE_KEY) {
            flutter build windows --release `
              --build-name="$env:PERFECT_SEMANTIC_VERSION" `
              --build-number="$env:PERFECT_WINDOWS_BUILD_NUMBER" `
              --dart-define="SUPABASE_URL=$env:PERFECT_SUPABASE_URL" `
              --dart-define="SUPABASE_PUBLISHABLE_KEY=$env:PERFECT_SUPABASE_PUBLISHABLE_KEY" `
              --dart-define="SUPABASE_AUTH_REDIRECT_URI=perfect://login-callback"
            "mode=configured-private" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          } else {
            flutter build windows --release `
              --build-name="$env:PERFECT_SEMANTIC_VERSION" `
              --build-number="$env:PERFECT_WINDOWS_BUILD_NUMBER"
            "mode=verification-only-unconfigured" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
            Write-Warning "Supabase repository secrets are absent. This artifact verifies compilation but opens the configuration screen and is not a sync-ready install."
          }
      - name: Complete and package the portable Windows bundle
        shell: pwsh
        env:
          PERFECT_ARTIFACT_VERSION: ${{ needs.prepare.outputs.artifact_version }}
        run: |
          $release = Join-Path $env:GITHUB_WORKSPACE "build/windows/x64/runner/Release"
          $vswhere = Join-Path ${env:ProgramFiles(x86)} `
            "Microsoft Visual Studio\Installer\vswhere.exe"
          if (-not (Test-Path -LiteralPath $vswhere)) {
            throw "Visual Studio discovery tool was not found."
          }
          $visualStudio = (& $vswhere `
            -latest `
            -products * `
            -property installationPath).Trim()
          if (-not $visualStudio) {
            throw "Visual Studio installation was not found."
          }
          $redistRoot = Join-Path $visualStudio "VC\Redist\MSVC"
          $requiredRuntimeNames = @(
            "msvcp140.dll",
            "vcruntime140.dll",
            "vcruntime140_1.dll"
          )
          # VS 2026 images can expose a `v145` redist directory beside
          # numeric MSVC-version directories. Discover the actual x64 CRT
          # payload instead of parsing vendor folder names as System.Version.
          $crtFolder = Get-ChildItem `
            -LiteralPath $redistRoot `
            -Directory `
            -Recurse `
            -Filter "Microsoft.VC*.CRT" `
            -ErrorAction SilentlyContinue |
            Where-Object {
              $candidate = $_
              $candidate.Parent.Name -eq "x64" -and
              @(
                $requiredRuntimeNames |
                  Where-Object {
                    -not (Test-Path -LiteralPath (
                      Join-Path $candidate.FullName $_
                    ))
                  }
              ).Count -eq 0
            } |
            Sort-Object LastWriteTimeUtc -Descending |
            Select-Object -First 1
          if (-not $crtFolder) {
            throw "The x64 Visual C++ application-local runtime was not found."
          }
          foreach ($runtimeName in $requiredRuntimeNames) {
            $source = Join-Path $crtFolder.FullName $runtimeName
            if (-not (Test-Path -LiteralPath $source)) {
              throw "Required portable runtime is missing: $runtimeName"
            }
            Copy-Item -LiteralPath $source -Destination $release -Force
          }

          $checksumPath = Join-Path $release "SHA256SUMS.txt"
          $checksumLines = Get-ChildItem -LiteralPath $release -Recurse -File |
            Where-Object { $_.FullName -ne $checksumPath } |
            Sort-Object FullName |
            ForEach-Object {
              $relative = [IO.Path]::GetRelativePath(
                $release,
                $_.FullName
              ).Replace("\", "/")
              "$((Get-FileHash -Algorithm SHA256 -LiteralPath $_.FullName).Hash) *$relative"
            }
          [IO.File]::WriteAllLines(
            $checksumPath,
            $checksumLines,
            [Text.UTF8Encoding]::new($false)
          )
          if ($checksumLines.Count -lt 10) {
            throw "Portable bundle checksum coverage is unexpectedly incomplete."
          }
          Push-Location $release
          try {
            foreach ($line in Get-Content -LiteralPath $checksumPath) {
              if ($line -notmatch '^([0-9A-Fa-f]{64}) \*(.+)$') {
                throw "Malformed portable checksum entry: $line"
              }
              $expected = $Matches[1].ToUpperInvariant()
              $relative = $Matches[2].Replace('/', [IO.Path]::DirectorySeparatorChar)
              $actual = (Get-FileHash -Algorithm SHA256 -LiteralPath $relative).Hash
              if ($actual -ne $expected) {
                throw "Portable checksum mismatch before packaging: $relative"
              }
            }
          } finally {
            Pop-Location
          }

          $portableOutput = Join-Path `
            $env:GITHUB_WORKSPACE `
            'build/windows/x64/portable'
          $portableStage = Join-Path $env:RUNNER_TEMP 'perfect-portable-stage'
          New-Item -ItemType Directory -Force -Path $portableOutput | Out-Null
          New-Item -ItemType Directory -Force -Path $portableStage | Out-Null
          Get-ChildItem -LiteralPath $release -Force |
            Where-Object { $_.Name -ne 'SHA256SUMS.txt' } |
            ForEach-Object {
              Copy-Item `
                -LiteralPath $_.FullName `
                -Destination $portableStage `
                -Recurse `
                -Force
            }
          $portableName = (
            "Perfect-$env:PERFECT_ARTIFACT_VERSION-Windows-Portable.zip"
          )
          $portablePath = Join-Path $portableOutput $portableName
          Compress-Archive `
            -Path (Join-Path $portableStage '*') `
            -DestinationPath $portablePath `
            -CompressionLevel Optimal

          Add-Type -AssemblyName System.IO.Compression.FileSystem
          $archive = [IO.Compression.ZipFile]::OpenRead($portablePath)
          try {
            $entries = @($archive.Entries | Where-Object { $_.FullName })
            $names = @($entries | ForEach-Object {
              $_.FullName.Replace('\', '/')
            })
            if (
              $names -contains 'SHA256SUMS.txt' -or
              @($names | Where-Object {
                $_ -match '(^|/)perfect-portable-stage/'
              }).Count -gt 0
            ) {
              throw 'Portable release ZIP contains a CI-only or wrapper entry.'
            }
            foreach ($requiredName in @(
              'Perfect.exe',
              'flutter_windows.dll',
              'msvcp140.dll',
              'vcruntime140.dll',
              'vcruntime140_1.dll'
            )) {
              if ($names -notcontains $requiredName) {
                throw "Portable release ZIP is missing $requiredName."
              }
            }
            if (-not ($names | Where-Object { $_ -like 'data/*' })) {
              throw 'Portable release ZIP is missing the Flutter data tree.'
            }
          } finally {
            $archive.Dispose()
          }
          Write-Output "Portable release asset: $portablePath"
      # msix cleans its temporary VC runtime files from the shared Release
      # directory after packaging. Preserve the complete portable bundle first.
      - name: Preserve private Windows build
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: perfect-${{ needs.prepare.outputs.artifact_version }}-windows-x64-portable-${{ steps.windows-build.outputs.mode }}
          path: build/windows/x64/portable/Perfect-*-Windows-Portable.zip
          if-no-files-found: error
          retention-days: 14
      - name: Package signed private MSIX
        id: windows-msix
        if: needs.prepare.outputs.trusted_build == 'true'
        shell: pwsh
        env:
          PERFECT_WINDOWS_PFX_BASE64: ${{ secrets.PERFECT_WINDOWS_PFX_BASE64 }}
          PERFECT_WINDOWS_PFX_PASSWORD: ${{ secrets.PERFECT_WINDOWS_PFX_PASSWORD }}
          PERFECT_WINDOWS_CERT_THUMBPRINT: ${{ vars.PERFECT_WINDOWS_CERT_THUMBPRINT }}
          PERFECT_MSIX_VERSION: ${{ needs.prepare.outputs.msix_version }}
          PERFECT_ARTIFACT_VERSION: ${{ needs.prepare.outputs.artifact_version }}
        run: |
          $missing = @(
            "PERFECT_WINDOWS_PFX_BASE64",
            "PERFECT_WINDOWS_PFX_PASSWORD",
            "PERFECT_WINDOWS_CERT_THUMBPRINT"
          ) | Where-Object { -not [Environment]::GetEnvironmentVariable($_) }
          if ($missing.Count -gt 0) {
            throw "Trusted Windows builds require the complete stable signing contract. Missing: $($missing -join ', ')"
          }

          $pfxPath = Join-Path $env:RUNNER_TEMP "perfect-private.pfx"
          $cerPath = Join-Path $env:RUNNER_TEMP "perfect-private.cer"
          $msixOutput = Join-Path $env:GITHUB_WORKSPACE "build/windows/x64/msix"
          New-Item -ItemType Directory -Force -Path $msixOutput | Out-Null
          $msixVersion = $env:PERFECT_MSIX_VERSION

          $certificate = $null
          $securePfxPassword = $null
          $signingCertificatePath = $null
          try {
            [IO.File]::WriteAllBytes(
              $pfxPath,
              [Convert]::FromBase64String($env:PERFECT_WINDOWS_PFX_BASE64)
            )
            $env:PERFECT_WINDOWS_PFX_BASE64 = $null
            $securePfxPassword = ConvertTo-SecureString `
              $env:PERFECT_WINDOWS_PFX_PASSWORD `
              -AsPlainText `
              -Force
            $env:PERFECT_WINDOWS_PFX_PASSWORD = $null
            $importedCertificates = @(
              Import-PfxCertificate `
                -FilePath $pfxPath `
                -Password $securePfxPassword `
                -CertStoreLocation "Cert:\CurrentUser\My"
            )
            if ($importedCertificates.Count -ne 1) {
              throw "The Windows PFX must contain exactly one signing certificate."
            }
            $certificate = $importedCertificates[0]
            $signingCertificatePath = `
              "Cert:\CurrentUser\My\$($certificate.Thumbprint)"
            $expectedThumbprint = $env:PERFECT_WINDOWS_CERT_THUMBPRINT `
              -replace "[^0-9A-Fa-f]", ""
            $basicConstraintsExtensions = @(
              $certificate.Extensions |
                Where-Object { $_.Oid.Value -eq '2.5.29.19' }
            )
            if ($basicConstraintsExtensions.Count -ne 1) {
              throw 'The Windows signer has ambiguous basic constraints.'
            }
            $basicConstraints = [Security.Cryptography.X509Certificates.X509BasicConstraintsExtension]::new(
              $basicConstraintsExtensions[0],
              $basicConstraintsExtensions[0].Critical
            )
            if (
              $certificate.Subject -ne "CN=K1 Perfect Private" -or
              $certificate.Issuer -ne $certificate.Subject -or
              $basicConstraints.CertificateAuthority -or
              -not $certificate.HasPrivateKey -or
              $certificate.Thumbprint -ne $expectedThumbprint -or
              $certificate.NotBefore.ToUniversalTime() -gt [DateTime]::UtcNow -or
              $certificate.NotAfter.ToUniversalTime() -lt [DateTime]::UtcNow.AddDays(30)
            ) {
              throw "The Windows end-entity certificate publisher, private key, fingerprint, or validity window does not match the pinned package identity."
            }
            $codeSigningOid = "1.3.6.1.5.5.7.3.3"
            $hasCodeSigningEku = $certificate.Extensions |
              Where-Object {
                $_ -is [Security.Cryptography.X509Certificates.X509EnhancedKeyUsageExtension]
              } |
              ForEach-Object { $_.EnhancedKeyUsages } |
              Where-Object { $_.Value -eq $codeSigningOid }
            if (-not $hasCodeSigningEku) {
              throw "The Windows certificate is not valid for code signing."
            }

            [IO.File]::WriteAllBytes(
              $cerPath,
              $certificate.Export(
                [Security.Cryptography.X509Certificates.X509ContentType]::Cert
              )
            )

            # The PFX password never enters process argv. msix invokes SignTool
            # against the exact, pinned certificate in the ephemeral runner's
            # CurrentUser store.
            $signToolOptions = (
              "/fd SHA256 /td SHA256 /tr " +
              "http://timestamp.digicert.com /sha1 $expectedThumbprint"
            )
            Write-Output "::notice::Starting signed MSIX packaging."
            dart run msix:create `
              --build-windows false `
              --version $msixVersion `
              --signtool-options $signToolOptions `
              --install-certificate false
            if ($LASTEXITCODE -ne 0) {
              throw "Private MSIX packaging failed with exit code $LASTEXITCODE."
            }
            Write-Output "::notice::Signed MSIX packaging completed."

            $packages = @(Get-ChildItem -LiteralPath $msixOutput -Filter "*.msix")
            if ($packages.Count -ne 1) {
              throw "Expected exactly one MSIX package, found $($packages.Count)."
            }
            $package = $packages[0]
            $finalPackageName = "Perfect-$env:PERFECT_ARTIFACT_VERSION-windows-x64.msix"
            $finalPackagePath = Join-Path $msixOutput $finalPackageName
            Move-Item -LiteralPath $package.FullName -Destination $finalPackagePath
            $package = Get-Item -LiteralPath $finalPackagePath

            Add-Type -AssemblyName System.IO.Compression.FileSystem
            $archive = [IO.Compression.ZipFile]::OpenRead($package.FullName)
            try {
              $manifestEntry = $archive.GetEntry("AppxManifest.xml")
              $blockMapEntry = $archive.GetEntry("AppxBlockMap.xml")
              $signatureEntry = $archive.GetEntry("AppxSignature.p7x")
              if (-not $manifestEntry -or -not $blockMapEntry -or -not $signatureEntry) {
                throw "MSIX is missing its manifest, block map, or package signature."
              }
              $reader = [IO.StreamReader]::new($manifestEntry.Open())
              try {
                [xml]$manifest = $reader.ReadToEnd()
              } finally {
                $reader.Dispose()
              }

              $namespaces = [Xml.XmlNamespaceManager]::new($manifest.NameTable)
              $namespaces.AddNamespace(
                "f",
                "http://schemas.microsoft.com/appx/manifest/foundation/windows10"
              )
              $namespaces.AddNamespace(
                "uap",
                "http://schemas.microsoft.com/appx/manifest/uap/windows10"
              )
              $identity = $manifest.SelectSingleNode(
                "/f:Package/f:Identity",
                $namespaces
              )
              $displayName = $manifest.SelectSingleNode(
                "/f:Package/f:Properties/f:DisplayName",
                $namespaces
              )
              $protocol = $manifest.SelectSingleNode(
                "//uap:Protocol[@Name='perfect']",
                $namespaces
              )
              if (
                -not $identity -or
                $identity.GetAttribute("Name") -ne "com.k1tvkli2003.perfect" -or
                $identity.GetAttribute("Publisher") -ne "CN=K1 Perfect Private" -or
                $identity.GetAttribute("ProcessorArchitecture") -ne "x64" -or
                $identity.GetAttribute("Version") -ne $msixVersion -or
                -not $displayName -or
                $displayName.InnerText -ne "Perfect!" -or
                -not $protocol
              ) {
                throw "MSIX identity, version, display name, architecture, or protocol drifted."
              }

              $blockMapReader = [IO.StreamReader]::new($blockMapEntry.Open())
              try {
                [xml]$blockMap = $blockMapReader.ReadToEnd()
              } finally {
                $blockMapReader.Dispose()
              }
              if (
                $blockMap.DocumentElement.HashMethod -ne
                "http://www.w3.org/2001/04/xmlenc#sha256"
              ) {
                throw "MSIX block-map hashing drifted away from SHA-256."
              }

              $signatureStream = $signatureEntry.Open()
              $signatureBuffer = [IO.MemoryStream]::new()
              try {
                $signatureStream.CopyTo($signatureBuffer)
                $signatureBytes = $signatureBuffer.ToArray()
              } finally {
                $signatureStream.Dispose()
                $signatureBuffer.Dispose()
              }
              if (
                $signatureBytes.Length -le 4 -or
                [Text.Encoding]::ASCII.GetString($signatureBytes, 0, 4) -ne "PKCX"
              ) {
                throw "MSIX AppxSignature.p7x has an invalid package-signature header."
              }
              $cmsBytes = [byte[]]::new($signatureBytes.Length - 4)
              [Array]::Copy(
                $signatureBytes,
                4,
                $cmsBytes,
                0,
                $cmsBytes.Length
              )
              Add-Type -AssemblyName System.Security
              $signedCms = [Security.Cryptography.Pkcs.SignedCms]::new()
              $signedCms.Decode($cmsBytes)
              # The runner must not mutate Trusted Root merely to prove the
              # cryptographic signature. Certificate trust is an install-time
              # device policy; this verifies the CMS signature and timestamp.
              $signedCms.CheckSignature($true)
              if ($signedCms.SignerInfos.Count -ne 1) {
                throw "MSIX must contain exactly one primary package signer."
              }
              $packageSigner = $signedCms.SignerInfos[0]
              if (
                -not $packageSigner.Certificate -or
                $packageSigner.Certificate.Thumbprint -ne $expectedThumbprint -or
                $packageSigner.Certificate.Subject -ne "CN=K1 Perfect Private"
              ) {
                throw "MSIX cryptographic signer does not match the pinned publisher."
              }
            } finally {
              $archive.Dispose()
            }

            $signTool = Get-ChildItem `
              -Path "${env:ProgramFiles(x86)}\Windows Kits\10\bin" `
              -Filter "signtool.exe" `
              -Recurse |
              Where-Object { $_.FullName -match '\\x64\\signtool\.exe$' } |
              Sort-Object FullName -Descending |
              Select-Object -First 1
            if (-not $signTool) {
              throw "The Windows SDK signing verifier was not found."
            }
            $verifyOutput = @(
              & $signTool.FullName verify /pa /all /v $package.FullName 2>&1 |
                ForEach-Object { "$_" }
            )
            $verifyExitCode = $LASTEXITCODE
            $verifyOutput | ForEach-Object { Write-Output $_ }
            $verifyText = $verifyOutput -join "`n"
            if (
              $verifyText -notmatch "The signature is timestamped:\s+" -or
              $verifyText -notmatch "Timestamp Verified by:\s+" -or
              $verifyText -notmatch "DigiCert"
            ) {
              throw "SignTool did not prove the RFC 3161 timestamp chain."
            }
            if ($verifyExitCode -ne 0) {
              $signToolErrors = [regex]::Matches(
                $verifyText,
                "SignTool Error:"
              )
              $hasOnlyPrivateRootError = (
                $verifyExitCode -eq 1 -and
                $signToolErrors.Count -eq 1 -and
                $verifyText -match (
                  "SignTool Error:\s+A certificate chain processed,\s+" +
                  "but terminated in a root\s+certificate which is not " +
                  "trusted by\s+the trust provider\."
                ) -and
                $verifyText -match "Number of errors:\s+1"
              )
              if (-not $hasOnlyPrivateRootError) {
                throw "MSIX policy verification failed with an unexpected error."
              }
              Write-Output "::notice::Signature integrity passed; private publisher trust remains an install-time device policy."
              # PowerShell otherwise propagates SignTool's expected native
              # exit code even though the exact private-root boundary passed.
              $global:LASTEXITCODE = 0
            }

            Copy-Item `
              -LiteralPath $cerPath `
              -Destination (Join-Path $msixOutput "Perfect-private.cer")

            $iscc = $env:PERFECT_ISCC_PATH
            if (-not (Test-Path -LiteralPath $iscc -PathType Leaf)) {
              throw 'The pinned Inno Setup compiler path was not preserved.'
            }
            if ($env:PERFECT_ISCC_VERSION -cne '7.0.2') {
              throw (
                'The pinned Inno Setup version was not preserved: ' +
                $env:PERFECT_ISCC_VERSION
              )
            }
            $isccVersion = [version]$env:PERFECT_ISCC_VERSION
            Write-Output "::notice::Compiling with hosted Inno Setup $isccVersion."

            $setupOutput = Join-Path `
              $env:GITHUB_WORKSPACE `
              'build/windows/x64/setup'
            New-Item -ItemType Directory -Force -Path $setupOutput | Out-Null
            $installerDefinition = Join-Path `
              $env:GITHUB_WORKSPACE `
              'tool/windows/PerfectBootstrap.iss'
            $installerScript = Join-Path `
              $env:GITHUB_WORKSPACE `
              'tool/windows/Install-Perfect.ps1'
            $setupIcon = Join-Path `
              $env:GITHUB_WORKSPACE `
              'windows/runner/resources/app_icon.ico'
            $isccArguments = @(
              '/Qp',
              "/DPayloadMsix=$($package.FullName)",
              "/DPayloadCertificate=$cerPath",
              "/DInstallerScript=$installerScript",
              "/DArtifactVersion=$env:PERFECT_ARTIFACT_VERSION",
              "/DMsixVersion=$msixVersion",
              "/DCertificateThumbprint=$expectedThumbprint",
              '/DCertificateSubject=CN=K1 Perfect Private',
              '/DPackageIdentityName=com.k1tvkli2003.perfect',
              '/DPackagePublisher=CN=K1 Perfect Private',
              "/DSetupIcon=$setupIcon",
              "/DOutputDirectory=$setupOutput",
              $installerDefinition
            )
            & $iscc @isccArguments
            if ($LASTEXITCODE -ne 0) {
              throw "Inno Setup compilation failed with exit code $LASTEXITCODE."
            }
            $setups = @(
              Get-ChildItem -LiteralPath $setupOutput -Filter '*.exe' -File
            )
            $expectedSetupName = (
              "Perfect-$env:PERFECT_ARTIFACT_VERSION-Windows-Setup.exe"
            )
            if (
              $setups.Count -ne 1 -or
              $setups[0].Name -cne $expectedSetupName
            ) {
              throw (
                'Inno Setup must emit exactly the expected single-file ' +
                "bootstrapper $expectedSetupName."
              )
            }
            $setup = $setups[0]

            & $signTool.FullName sign `
              /fd SHA256 `
              /td SHA256 `
              /tr http://timestamp.digicert.com `
              /sha1 $expectedThumbprint `
              /v `
              $setup.FullName
            if ($LASTEXITCODE -ne 0) {
              throw "Setup signing failed with exit code $LASTEXITCODE."
            }
            $setupSignature = Get-AuthenticodeSignature `
              -FilePath $setup.FullName
            if (
              -not $setupSignature.SignerCertificate -or
              $setupSignature.SignerCertificate.Thumbprint -ne
                $expectedThumbprint -or
              $setupSignature.SignerCertificate.Subject -ne
                'CN=K1 Perfect Private' -or
              -not $setupSignature.TimeStamperCertificate -or
              $setupSignature.TimeStamperCertificate.Subject -notmatch
                'DigiCert'
            ) {
              throw 'Signed Setup publisher or RFC 3161 timestamp drifted.'
            }
            $setupVerifyOutput = @(
              & $signTool.FullName verify /pa /all /v $setup.FullName 2>&1 |
                ForEach-Object { "$_" }
            )
            $setupVerifyExitCode = $LASTEXITCODE
            $setupVerifyText = $setupVerifyOutput -join "`n"
            $setupVerifyOutput | ForEach-Object { Write-Output $_ }
            if (
              $setupVerifyText -notmatch 'The signature is timestamped:\s+' -or
              $setupVerifyText -notmatch 'Timestamp Verified by:\s+' -or
              $setupVerifyText -notmatch 'DigiCert'
            ) {
              throw 'SignTool did not prove the Setup RFC 3161 timestamp chain.'
            }
            if ($setupVerifyExitCode -ne 0) {
              $setupSignToolErrors = [regex]::Matches(
                $setupVerifyText,
                'SignTool Error:'
              )
              $setupHasOnlyPrivateRootError = (
                $setupVerifyExitCode -eq 1 -and
                $setupSignToolErrors.Count -eq 1 -and
                $setupVerifyText -match (
                  'SignTool Error:\s+A certificate chain processed,\s+' +
                  'but terminated in a root\s+certificate which is not ' +
                  'trusted by\s+the trust provider\.'
                ) -and
                $setupVerifyText -match 'Number of errors:\s+1'
              )
              if (-not $setupHasOnlyPrivateRootError) {
                throw 'Setup policy verification failed unexpectedly.'
              }
              $global:LASTEXITCODE = 0
            }

            $checksumPath = Join-Path $msixOutput "SHA256SUMS.txt"
            $checksumInputs = @(
              Get-ChildItem -LiteralPath $msixOutput -File |
                Where-Object { $_.FullName -ne $checksumPath }
            ) + @($setup)
            $checksumLines = $checksumInputs |
              Sort-Object Name |
              ForEach-Object {
                "$((Get-FileHash -Algorithm SHA256 -LiteralPath $_.FullName).Hash) *$($_.Name)"
              }
            [IO.File]::WriteAllLines(
              $checksumPath,
              $checksumLines,
              [Text.UTF8Encoding]::new($false)
            )
            if ($checksumLines.Count -ne 3) {
              throw "Signed Windows checksum coverage must include exactly MSIX, certificate, and Setup."
            }
            "mode=signed-private" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
            "version=$msixVersion" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          } finally {
            if ($certificate) {
              $certificate.Dispose()
            }
            if ($signingCertificatePath -and (
              Test-Path -LiteralPath $signingCertificatePath
            )) {
              Remove-Item -LiteralPath $signingCertificatePath -Force
            }
            if ($securePfxPassword) {
              $securePfxPassword.Dispose()
            }
            Remove-Item -LiteralPath $pfxPath,$cerPath -Force -ErrorAction SilentlyContinue
          }
      - name: Preserve signed private Windows installer
        if: steps.windows-msix.outputs.mode == 'signed-private'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: perfect-${{ needs.prepare.outputs.artifact_version }}-windows-x64-msix-${{ steps.windows-build.outputs.mode }}
          path: |
            build/windows/x64/msix/Perfect-*-windows-x64.msix
            build/windows/x64/msix/Perfect-private.cer
            build/windows/x64/msix/SHA256SUMS.txt
            build/windows/x64/setup/Perfect-*-Windows-Setup.exe
          if-no-files-found: error
          retention-days: 14
      - name: Prove MSIX install-over preserves LocalState
        if: steps.windows-msix.outputs.mode == 'signed-private'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          PERFECT_CURRENT_ARTIFACT_VERSION: ${{ needs.prepare.outputs.artifact_version }}
          PERFECT_CURRENT_MSIX_VERSION: ${{ needs.prepare.outputs.msix_version }}
          PERFECT_WINDOWS_CERT_THUMBPRINT: ${{ vars.PERFECT_WINDOWS_CERT_THUMBPRINT }}
        run: |
          $ErrorActionPreference = "Stop"
          $expectedThumbprint = $env:PERFECT_WINDOWS_CERT_THUMBPRINT `
            -replace '[^0-9A-Fa-f]', ''
          $expectedThumbprint = $expectedThumbprint.ToUpperInvariant()
          $currentArtifactBuild = [int](
            $env:PERFECT_CURRENT_ARTIFACT_VERSION -replace '^.*-build\.', ''
          )
          $currentVersion = [version]$env:PERFECT_CURRENT_MSIX_VERSION
          $currentDirectory = Resolve-Path "build/windows/x64/msix"
          $currentPackage = @(
            Get-ChildItem -LiteralPath $currentDirectory -Filter '*.msix'
          )
          $publicCertificatePath = Join-Path `
            $currentDirectory `
            'Perfect-private.cer'
          if ($currentPackage.Count -ne 1) {
            throw "Expected one current MSIX package, found $($currentPackage.Count)."
          }

          $artifactResponse = Invoke-RestMethod `
            -Uri (
              "https://api.github.com/repos/$env:GITHUB_REPOSITORY/" +
              "actions/artifacts?per_page=100"
            ) `
            -Headers @{
              Accept = 'application/vnd.github+json'
              Authorization = "Bearer $env:GH_TOKEN"
              'X-GitHub-Api-Version' = '2022-11-28'
            }
          $candidates = @(
            $artifactResponse.artifacts |
              Where-Object {
                -not $_.expired -and
                $_.workflow_run.head_branch -eq 'main' -and
                $_.name -match (
                  '^perfect-[0-9]+\.[0-9]+\.[0-9]+-build\.' +
                  '([0-9]+)-windows-x64-msix-configured-private$'
                ) -and
                [int]$Matches[1] -lt $currentArtifactBuild
              } |
              ForEach-Object {
                [pscustomobject]@{
                  Artifact = $_
                  Build = [int]([regex]::Match(
                    $_.name,
                    '-build\.([0-9]+)-windows-x64-msix'
                  ).Groups[1].Value)
                }
              } |
              Sort-Object Build -Descending
          )
          if ($candidates.Count -eq 0) {
            Write-Output (
              '::notice::No older private MSIX artifact exists yet; ' +
              'install-over proof begins with the next trusted build.'
            )
            exit 0
          }

          $proofRoot = Join-Path $env:RUNNER_TEMP 'perfect-msix-install-over'
          New-Item -ItemType Directory -Force -Path $proofRoot | Out-Null
          $previousPackage = $null
          foreach ($candidate in $candidates) {
            $candidateRoot = Join-Path `
              $proofRoot `
              "candidate-$($candidate.Artifact.id)"
            $archivePath = Join-Path $candidateRoot 'artifact.zip'
            $candidateDirectory = Join-Path $candidateRoot 'contents'
            New-Item -ItemType Directory -Force -Path $candidateDirectory |
              Out-Null
            Invoke-WebRequest `
              -Uri $candidate.Artifact.archive_download_url `
              -Headers @{
                Accept = 'application/vnd.github+json'
                Authorization = "Bearer $env:GH_TOKEN"
                'X-GitHub-Api-Version' = '2022-11-28'
              } `
              -OutFile $archivePath
            Expand-Archive `
              -LiteralPath $archivePath `
              -DestinationPath $candidateDirectory
            $candidatePackages = @(
              Get-ChildItem `
                -LiteralPath $candidateDirectory `
                -Filter '*.msix' `
                -Recurse
            )
            $candidateCertificates = @(
              Get-ChildItem `
                -LiteralPath $candidateDirectory `
                -Filter 'Perfect-private.cer' `
                -Recurse
            )
            if (
              $candidatePackages.Count -ne 1 -or
              $candidateCertificates.Count -ne 1
            ) {
              throw (
                "Older artifact $($candidate.Artifact.name) does not contain " +
                'one MSIX and one public certificate.'
              )
            }
            $candidateCertificate = [Security.Cryptography.X509Certificates.X509Certificate2]::new(
              $candidateCertificates[0].FullName
            )
            try {
              if ($candidateCertificate.Thumbprint -eq $expectedThumbprint) {
                $previousPackage = @($candidatePackages)
                break
              }
            } finally {
              $candidateCertificate.Dispose()
            }
          }
          if ($null -eq $previousPackage) {
            Remove-Item -LiteralPath $proofRoot -Recurse -Force
            Write-Output (
              '::notice::No older private MSIX with the pinned signer exists; ' +
              'this build establishes the install-over baseline.'
            )
            exit 0
          }

          $certificate = [Security.Cryptography.X509Certificates.X509Certificate2]::new(
            $publicCertificatePath
          )
          try {
            $basicConstraintsExtensions = @(
              $certificate.Extensions |
                Where-Object { $_.Oid.Value -eq '2.5.29.19' }
            )
            if ($basicConstraintsExtensions.Count -ne 1) {
              throw 'The pinned install certificate has ambiguous basic constraints.'
            }
            $basicConstraints = [Security.Cryptography.X509Certificates.X509BasicConstraintsExtension]::new(
              $basicConstraintsExtensions[0],
              $basicConstraintsExtensions[0].Critical
            )
            if (
              $certificate.Thumbprint -ne $expectedThumbprint -or
              $certificate.Subject -ne 'CN=K1 Perfect Private' -or
              $certificate.Issuer -ne $certificate.Subject -or
              $basicConstraints.CertificateAuthority -or
              $certificate.HasPrivateKey
            ) {
              throw (
                'The public install certificate does not match the pinned ' +
                'self-signed end-entity publisher.'
              )
            }
          } finally {
            $certificate.Dispose()
          }

          $trustedPath = "Cert:\LocalMachine\TrustedPeople\$expectedThumbprint"
          $trustPreexisted = Test-Path -LiteralPath $trustedPath
          $sideloadRegistryPaths = @(
            'SOFTWARE\Microsoft\Windows\CurrentVersion\AppModelUnlock',
            'SOFTWARE\Policies\Microsoft\Windows\Appx'
          )
          $sideloadSnapshots = @()
          $installedName = 'com.k1tvkli2003.perfect'
          try {
            foreach ($registryPath in $sideloadRegistryPaths) {
              $registryKey = [Microsoft.Win32.Registry]::LocalMachine.OpenSubKey(
                $registryPath,
                $true
              )
              $keyPreexisted = $null -ne $registryKey
              if (-not $keyPreexisted) {
                $registryKey = [Microsoft.Win32.Registry]::LocalMachine.CreateSubKey(
                  $registryPath,
                  $true
                )
              }
              if ($null -eq $registryKey) {
                throw "Unable to open the sideload policy key $registryPath."
              }
              $valuePreexisted = @($registryKey.GetValueNames()) -contains `
                'AllowAllTrustedApps'
              $previousValue = $null
              $previousKind = $null
              if ($valuePreexisted) {
                $previousValue = $registryKey.GetValue(
                  'AllowAllTrustedApps',
                  $null,
                  [Microsoft.Win32.RegistryValueOptions]::DoNotExpandEnvironmentNames
                )
                $previousKind = $registryKey.GetValueKind('AllowAllTrustedApps')
              }
              $registryKey.SetValue(
                'AllowAllTrustedApps',
                1,
                [Microsoft.Win32.RegistryValueKind]::DWord
              )
              $sideloadSnapshots += [pscustomobject]@{
                Key = $registryKey
                Path = $registryPath
                KeyPreexisted = $keyPreexisted
                ValuePreexisted = $valuePreexisted
                PreviousValue = $previousValue
                PreviousKind = $previousKind
              }
            }
            if (-not $trustPreexisted) {
              $imported = Import-Certificate `
                -FilePath $publicCertificatePath `
                -CertStoreLocation 'Cert:\LocalMachine\TrustedPeople'
              if ($imported.Thumbprint -ne $expectedThumbprint) {
                throw 'The machine trust import returned a different certificate.'
              }
            }
            if (-not (Test-Path -LiteralPath $trustedPath)) {
              throw 'The pinned publisher is absent from LocalMachine TrustedPeople.'
            }

            Add-AppxPackage `
              -Path $previousPackage[0].FullName `
              -ForceApplicationShutdown
            $previousInstallation = Get-AppxPackage -Name $installedName
            if (-not $previousInstallation) {
              throw 'The previous MSIX did not install.'
            }
            $previousVersion = [version]$previousInstallation.Version
            if ($previousVersion -ge $currentVersion) {
              throw (
                "Previous version $previousVersion must be lower than " +
                "current version $currentVersion."
              )
            }
            $previousFamily = $previousInstallation.PackageFamilyName
            $localState = Join-Path `
              $env:LOCALAPPDATA `
              "Packages\$previousFamily\LocalState"
            New-Item -ItemType Directory -Force -Path $localState | Out-Null
            $markerPath = Join-Path $localState 'ci-install-over-marker.json'
            $marker = [ordered]@{
              schema_version = 1
              previous_version = $previousVersion.ToString()
              package_family = $previousFamily
              nonce = [guid]::NewGuid().ToString()
            } | ConvertTo-Json -Compress
            [IO.File]::WriteAllText(
              $markerPath,
              $marker,
              [Text.UTF8Encoding]::new($false)
            )
            $markerHash = (
              Get-FileHash -Algorithm SHA256 -LiteralPath $markerPath
            ).Hash

            Add-AppxPackage `
              -Path $currentPackage[0].FullName `
              -ForceApplicationShutdown
            $currentInstallation = Get-AppxPackage -Name $installedName
            if (-not $currentInstallation) {
              throw 'The current MSIX did not install over the previous package.'
            }
            if ([version]$currentInstallation.Version -ne $currentVersion) {
              throw (
                "Installed version $($currentInstallation.Version) does not " +
                "match $currentVersion."
              )
            }
            if ($currentInstallation.PackageFamilyName -ne $previousFamily) {
              throw 'Package family changed during install-over.'
            }
            if (-not (Test-Path -LiteralPath $markerPath -PathType Leaf)) {
              throw 'LocalState marker disappeared during install-over.'
            }
            $currentMarkerHash = (
              Get-FileHash -Algorithm SHA256 -LiteralPath $markerPath
            ).Hash
            if ($currentMarkerHash -ne $markerHash) {
              throw 'LocalState marker changed during install-over.'
            }
            Write-Output (
              "::notice::MSIX install-over passed: $previousVersion -> " +
              "$currentVersion; package family and LocalState were preserved."
            )
          } finally {
            Get-AppxPackage -Name $installedName -ErrorAction SilentlyContinue |
              Remove-AppxPackage -ErrorAction SilentlyContinue
            if (-not $trustPreexisted -and (Test-Path -LiteralPath $trustedPath)) {
              Remove-Item -LiteralPath $trustedPath -Force
            }
            foreach ($snapshot in $sideloadSnapshots) {
              try {
                if ($snapshot.ValuePreexisted) {
                  $snapshot.Key.SetValue(
                    'AllowAllTrustedApps',
                    $snapshot.PreviousValue,
                    $snapshot.PreviousKind
                  )
                } else {
                  $snapshot.Key.DeleteValue('AllowAllTrustedApps', $false)
                }
              } finally {
                $snapshot.Key.Dispose()
              }
            }
            Remove-Item `
              -LiteralPath $proofRoot `
              -Recurse `
              -Force `
              -ErrorAction SilentlyContinue
          }

      - name: Prove self-contained Setup clean install and idempotent rerun
        if: steps.windows-msix.outputs.mode == 'signed-private'
        shell: pwsh
        env:
          PERFECT_CURRENT_ARTIFACT_VERSION: ${{ needs.prepare.outputs.artifact_version }}
          PERFECT_CURRENT_MSIX_VERSION: ${{ needs.prepare.outputs.msix_version }}
          PERFECT_WINDOWS_CERT_THUMBPRINT: ${{ vars.PERFECT_WINDOWS_CERT_THUMBPRINT }}
        run: |
          $ErrorActionPreference = 'Stop'
          $packageName = 'com.k1tvkli2003.perfect'
          $expectedVersion = [version]$env:PERFECT_CURRENT_MSIX_VERSION
          $expectedThumbprint = (
            $env:PERFECT_WINDOWS_CERT_THUMBPRINT -replace '[^0-9A-Fa-f]', ''
          ).ToUpperInvariant()
          $trustedPath = "Cert:\LocalMachine\TrustedPeople\$expectedThumbprint"
          function Get-CertificateStoreSnapshot {
            param(
              [Parameter(Mandatory = $true)]
              [string]$Path
            )
            $sha256 = [Security.Cryptography.SHA256]::Create()
            try {
              return @(
                Get-ChildItem -LiteralPath $Path |
                  Sort-Object Thumbprint |
                  ForEach-Object {
                    $rawHash = [BitConverter]::ToString(
                      $sha256.ComputeHash($_.RawData)
                    ).Replace('-', '')
                    "$($_.Thumbprint):$($rawHash):$($_.HasPrivateKey)"
                  }
              )
            } finally {
              $sha256.Dispose()
            }
          }
          $trustedPeopleBefore = Get-CertificateStoreSnapshot `
            -Path 'Cert:\LocalMachine\TrustedPeople'
          $trustedRootBefore = Get-CertificateStoreSnapshot `
            -Path 'Cert:\LocalMachine\Root'
          $trustPreexisted = Test-Path -LiteralPath $trustedPath
          $existingPackage = @(Get-AppxPackage -Name $packageName)
          if ($existingPackage.Count -ne 0) {
            throw 'Hosted installer proof must start without an installed Perfect package.'
          }

          $currentSetup = @(
            Get-ChildItem `
              -LiteralPath 'build/windows/x64/setup' `
              -Filter 'Perfect-*-Windows-Setup.exe' `
              -File
          )
          if ($currentSetup.Count -ne 1) {
            throw "Expected exactly one current Setup, found $($currentSetup.Count)."
          }
          $proofRoot = Join-Path `
            $env:RUNNER_TEMP `
            ('perfect-setup-proof-' + [guid]::NewGuid().ToString('N'))
          New-Item -ItemType Directory -Path $proofRoot -Force | Out-Null
          $machineInstallerLog = Join-Path `
            $env:ProgramFiles `
            (
              'Perfect Installer Logs\Perfect-setup-' +
              "$env:PERFECT_CURRENT_ARTIFACT_VERSION.log"
            )
          $userInstallerLog = Join-Path `
            $env:LOCALAPPDATA `
            (
              'Perfect\InstallerLogs\Perfect-setup-' +
              "$env:PERFECT_CURRENT_MSIX_VERSION-user.log"
            )

          function Write-SetupDiagnosticLog {
            param(
              [Parameter(Mandatory = $true)]
              [string]$Path,
              [Parameter(Mandatory = $true)]
              [string]$Label
            )
            if (Test-Path -LiteralPath $Path -PathType Leaf) {
              Write-Output "::group::Perfect Setup diagnostic: $Label"
              Get-Content -LiteralPath $Path | Write-Output
              Write-Output '::endgroup::'
            } else {
              Write-Output "::notice::Perfect Setup did not create $Label at $Path."
            }
          }

          function Invoke-PerfectSetup {
            param(
              [Parameter(Mandatory = $true)]
              [string]$Path,
              [Parameter(Mandatory = $true)]
              [string]$Label
            )
            $log = Join-Path $proofRoot "$Label.log"
            $arguments = @(
              '/SP-',
              '/VERYSILENT',
              '/SUPPRESSMSGBOXES',
              '/NORESTART',
              '/REDIRECTIONGUARD',
              "/LOG=$log"
            )
            $process = Start-Process `
              -FilePath $Path `
              -ArgumentList $arguments `
              -Wait `
              -PassThru `
              -WindowStyle Hidden
            Write-SetupDiagnosticLog -Path $log -Label "$Label Inno log"
            Write-SetupDiagnosticLog `
              -Path $machineInstallerLog `
              -Label "$Label machine phase"
            Write-SetupDiagnosticLog `
              -Path $userInstallerLog `
              -Label "$Label original-user phase"
            if ($process.ExitCode -ne 0) {
              throw "$Label failed with exit code $($process.ExitCode)."
            }
          }

          try {
            Invoke-PerfectSetup `
              -Path $currentSetup[0].FullName `
              -Label 'current-clean-setup'
            $packageDeadline = [DateTime]::UtcNow.AddSeconds(15)
            do {
              $baseline = @(Get-AppxPackage -Name $packageName)
              if (
                $baseline.Count -eq 1 -and
                [version]$baseline[0].Version -eq $expectedVersion
              ) {
                break
              }
              Start-Sleep -Milliseconds 500
            } while ([DateTime]::UtcNow -lt $packageDeadline)
            if (
              $baseline.Count -ne 1 -or
              [version]$baseline[0].Version -ne $expectedVersion
            ) {
              throw 'Current Setup did not complete the clean-install baseline.'
            }
            Write-Output (
              '::notice::Current Setup established the clean-install ' +
              'baseline; the second invocation proves idempotent update behavior.'
            )

            $baselineFamily = $baseline[0].PackageFamilyName
            $localState = Join-Path `
              $env:LOCALAPPDATA `
              "Packages\$baselineFamily\LocalState"
            New-Item -ItemType Directory -Path $localState -Force | Out-Null
            $markerPath = Join-Path $localState 'ci-setup-update-marker.json'
            $marker = [ordered]@{
              schema_version = 1
              baseline_version = $baseline[0].Version.ToString()
              package_family = $baselineFamily
              nonce = [guid]::NewGuid().ToString()
            } | ConvertTo-Json -Compress
            [IO.File]::WriteAllText(
              $markerPath,
              $marker,
              [Text.UTF8Encoding]::new($false)
            )
            $markerHash = (
              Get-FileHash -Algorithm SHA256 -LiteralPath $markerPath
            ).Hash

            Invoke-PerfectSetup `
              -Path $currentSetup[0].FullName `
              -Label 'current-update-setup'
            $installed = @(Get-AppxPackage -Name $packageName)
            if ($installed.Count -ne 1) {
              throw 'Current Setup did not register exactly one Perfect package.'
            }
            if ([version]$installed[0].Version -ne $expectedVersion) {
              throw (
                "Setup installed $($installed[0].Version), expected " +
                "$expectedVersion."
              )
            }
            if ($installed[0].PackageFamilyName -cne $baselineFamily) {
              throw 'Setup changed the Perfect package family during update.'
            }
            if (
              -not (Test-Path -LiteralPath $markerPath -PathType Leaf) -or
              (Get-FileHash -Algorithm SHA256 -LiteralPath $markerPath).Hash -ne
                $markerHash
            ) {
              throw 'Setup update did not preserve the exact LocalState marker.'
            }
            if (
              -not (Test-Path -LiteralPath $trustedPath) -or
              ((Get-Item -LiteralPath $trustedPath).HasPrivateKey)
            ) {
              throw 'Setup did not leave the exact public signer in TrustedPeople.'
            }
            $trustedRootDuring = Get-CertificateStoreSnapshot `
              -Path 'Cert:\LocalMachine\Root'
            if (
              (@($trustedRootBefore) -join "`n") -cne
                (@($trustedRootDuring) -join "`n")
            ) {
              throw 'Setup changed the LocalMachine Trusted Root inventory.'
            }
            Write-Output (
              "::notice::Setup proof passed; installed $expectedVersion, " +
              'kept package family and LocalState, and did not mutate Root.'
            )
          } finally {
            Get-AppxPackage -Name $packageName -ErrorAction SilentlyContinue |
              Remove-AppxPackage -ErrorAction SilentlyContinue
            if (
              -not $trustPreexisted -and
              (Test-Path -LiteralPath $trustedPath)
            ) {
              Remove-Item -LiteralPath $trustedPath -Force
            }
            $trustedRootAfter = Get-CertificateStoreSnapshot `
              -Path 'Cert:\LocalMachine\Root'
            $trustedPeopleAfter = Get-CertificateStoreSnapshot `
              -Path 'Cert:\LocalMachine\TrustedPeople'
            if (
              (@($trustedRootBefore) -join "`n") -cne
                (@($trustedRootAfter) -join "`n") -or
              (@($trustedPeopleBefore) -join "`n") -cne
                (@($trustedPeopleAfter) -join "`n")
            ) {
              throw 'Certificate stores did not return to their exact baseline.'
            }
            Remove-Item `
              -LiteralPath $proofRoot `
              -Recurse `
              -Force `
              -ErrorAction SilentlyContinue
          }

  publish:
    name: Publish private install-ready release
    needs: [prepare, quality-and-android, windows]
    if: needs.prepare.outputs.trusted_build == 'true' && success()
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      actions: read
      attestations: read
      contents: write
    steps:
      - name: Download current-run build transport
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: perfect-${{ needs.prepare.outputs.artifact_version }}-*
          path: build/release-inputs
      - name: Assemble exactly three release assets
        id: release-assets
        shell: bash
        env:
          PERFECT_ARTIFACT_VERSION: ${{ needs.prepare.outputs.artifact_version }}
          PERFECT_SEMANTIC_VERSION: ${{ needs.prepare.outputs.semantic_version }}
          PERFECT_ANDROID_VERSION_CODE: ${{ needs.prepare.outputs.android_version_code }}
          PERFECT_MSIX_VERSION: ${{ needs.prepare.outputs.msix_version }}
          PERFECT_RELEASE_TAG: ${{ needs.prepare.outputs.release_tag }}
        run: |
          set -euo pipefail
          inputs="$GITHUB_WORKSPACE/build/release-inputs"
          assets="$GITHUB_WORKSPACE/build/release-assets"
          notes="$GITHUB_WORKSPACE/build/release-notes.md"
          mkdir -p "$assets"

          mapfile -t android_matches < <(
            find "$inputs" -type f \
              -name "perfect-$PERFECT_ARTIFACT_VERSION-android-universal.apk"
          )
          mapfile -t setup_matches < <(
            find "$inputs" -type f \
              -name "Perfect-$PERFECT_ARTIFACT_VERSION-Windows-Setup.exe"
          )
          mapfile -t portable_matches < <(
            find "$inputs" -type f \
              -name "Perfect-$PERFECT_ARTIFACT_VERSION-Windows-Portable.zip"
          )
          if (( ${#android_matches[@]} != 1 )); then
            echo "::error::Expected exactly one Android APK transport, found ${#android_matches[@]}."
            exit 1
          fi
          if (( ${#setup_matches[@]} != 1 )); then
            echo "::error::Expected exactly one Windows Setup transport, found ${#setup_matches[@]}."
            exit 1
          fi
          if (( ${#portable_matches[@]} != 1 )); then
            echo "::error::Expected exactly one Windows portable transport, found ${#portable_matches[@]}."
            exit 1
          fi

          android_name="Perfect-$PERFECT_ARTIFACT_VERSION-Android.apk"
          setup_name="Perfect-$PERFECT_ARTIFACT_VERSION-Windows-Setup.exe"
          portable_name="Perfect-$PERFECT_ARTIFACT_VERSION-Windows-Portable.zip"
          cp "${android_matches[0]}" "$assets/$android_name"
          cp "${setup_matches[0]}" "$assets/$setup_name"
          cp "${portable_matches[0]}" "$assets/$portable_name"

          mapfile -t final_assets < <(
            find "$assets" -mindepth 1 -maxdepth 1 -type f -printf '%f\n' |
              sort
          )
          expected_assets=("$android_name" "$portable_name" "$setup_name")
          mapfile -t expected_assets < <(printf '%s\n' "${expected_assets[@]}" | sort)
          if (( ${#final_assets[@]} != 3 )) ||
            ! diff -u \
              <(printf '%s\n' "${expected_assets[@]}") \
              <(printf '%s\n' "${final_assets[@]}"); then
            echo "::error::The release directory must contain exactly the three approved install-ready assets."
            exit 1
          fi
          for asset in "${final_assets[@]}"; do
            if [[ ! -s "$assets/$asset" ]]; then
              echo "::error::Release asset is empty: $asset"
              exit 1
            fi
          done

          unzip -Z1 "$assets/$portable_name" > "$RUNNER_TEMP/perfect-portable-entries.txt"
          if grep -Eq '(^|/)SHA256SUMS(\.txt)?$|(^|/)Perfect-private\.cer$|\.msix$' \
            "$RUNNER_TEMP/perfect-portable-entries.txt"; then
            echo "::error::Portable ZIP contains CI-only installer/checksum material."
            exit 1
          fi
          for required in \
            Perfect.exe \
            flutter_windows.dll \
            msvcp140.dll \
            vcruntime140.dll \
            vcruntime140_1.dll; do
            if ! grep -Fxq "$required" "$RUNNER_TEMP/perfect-portable-entries.txt"; then
              echo "::error::Portable ZIP is missing $required."
              exit 1
            fi
          done
          if ! grep -Eq '^data/' "$RUNNER_TEMP/perfect-portable-entries.txt"; then
            echo "::error::Portable ZIP is missing the Flutter data tree."
            exit 1
          fi

          mapfile -t hashes < <(
            cd "$assets"
            sha256sum "${final_assets[@]}" | sort -k2
          )
          {
            echo "# Perfect! private release"
            echo
            echo "Commit: \`$GITHUB_SHA\`"
            echo "Android: \`$PERFECT_SEMANTIC_VERSION+$PERFECT_ANDROID_VERSION_CODE\`"
            echo "Windows package: \`$PERFECT_MSIX_VERSION\`"
            echo
            echo "## Install"
            echo
            echo "- **Android:** download \`$android_name\` and install/update it directly."
            echo "- **Windows:** download \`$setup_name\`, run it, and approve the administrator prompt. It verifies and trusts only the pinned Perfect! private publisher, then installs or updates the same MSIX identity."
            echo "- **Windows portable:** extract every file from \`$portable_name\` into one folder and run \`Perfect.exe\`."
            echo
            echo "The first Windows setup may show an unknown-publisher warning because this personal build uses a private self-signed certificate rather than a public code-signing service."
            echo
            echo "## SHA-256"
            echo
            echo '```text'
            printf '%s\n' "${hashes[@]}"
            echo '```'
          } > "$notes"
          echo "assets_dir=$assets" >> "$GITHUB_OUTPUT"
          echo "notes_file=$notes" >> "$GITHUB_OUTPUT"
      - name: Publish draft atomically and verify downloaded bytes
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          PERFECT_ARTIFACT_VERSION: ${{ needs.prepare.outputs.artifact_version }}
          PERFECT_RELEASE_TAG: ${{ needs.prepare.outputs.release_tag }}
          PERFECT_RELEASE_ASSETS_DIR: ${{ steps.release-assets.outputs.assets_dir }}
          PERFECT_RELEASE_NOTES_FILE: ${{ steps.release-assets.outputs.notes_file }}
        run: |
          set -euo pipefail
          tag="$PERFECT_RELEASE_TAG"
          title="Perfect! $PERFECT_ARTIFACT_VERSION"
          assets="$PERFECT_RELEASE_ASSETS_DIR"
          notes="$PERFECT_RELEASE_NOTES_FILE"
          release_json="$RUNNER_TEMP/perfect-release.json"
          remote_dir="$RUNNER_TEMP/perfect-release-download"
          mapfile -t expected_names < <(
            find "$assets" -mindepth 1 -maxdepth 1 -type f -printf '%f\n' |
              sort
          )

          verify_immutable_release() {
            local candidate_tag="$1"
            for attempt in 1 2 3 4 5 6; do
              if gh release verify "$candidate_tag" \
                --repo "$GITHUB_REPOSITORY"; then
                return 0
              fi
              sleep $((attempt * 2))
            done
            echo "::error::GitHub did not provide a valid immutable release attestation for $candidate_tag."
            return 1
          }

          resolve_release_tag_commit() {
            local candidate_tag="$1"
            local ref_response
            local resolved_sha
            if ref_response="$(
              gh api --include \
                "repos/$GITHUB_REPOSITORY/git/ref/tags/$candidate_tag" \
                2>&1
            )"; then
              if ! resolved_sha="$(
                gh api \
                  "repos/$GITHUB_REPOSITORY/commits/$candidate_tag" \
                  --jq '.sha'
              )"; then
                echo "::error::Existing release tag $candidate_tag could not be resolved to a commit."
                return 2
              fi
              printf '%s\n' "$resolved_sha"
              return 0
            fi
            if grep -Eq '^HTTP/[0-9.]+ 404 ' <<<"$ref_response"; then
              return 4
            fi
            printf '%s\n' "$ref_response" >&2
            echo "::error::Release tag lookup failed for $candidate_tag."
            return 2
          }

          ensure_release_tag() {
            local candidate_tag="$1"
            local resolved_sha
            local resolve_status
            if resolved_sha="$(resolve_release_tag_commit "$candidate_tag")"; then
              if [[ "$resolved_sha" != "$GITHUB_SHA" ]]; then
                echo "::error::Release tag $candidate_tag resolves to $resolved_sha instead of $GITHUB_SHA."
                return 1
              fi
              return 0
            else
              resolve_status=$?
            fi
            if (( resolve_status != 4 )); then
              return 1
            fi

            # Create the lightweight tag explicitly so --target can never be
            # silently ignored because a colliding tag already exists. A
            # concurrent creator may win the race; the mandatory re-read below
            # accepts it only when it resolves to this exact workflow commit.
            if ! gh api \
              --method POST \
              "repos/$GITHUB_REPOSITORY/git/refs" \
              -f "ref=refs/tags/$candidate_tag" \
              -f "sha=$GITHUB_SHA" \
              >/dev/null; then
              echo "::notice::Release tag creation raced or failed; verifying the resulting ref."
            fi
            if ! resolved_sha="$(resolve_release_tag_commit "$candidate_tag")"; then
              echo "::error::Release tag $candidate_tag is absent after the create attempt."
              return 1
            fi
            if [[ "$resolved_sha" != "$GITHUB_SHA" ]]; then
              echo "::error::Release tag $candidate_tag resolves to $resolved_sha instead of $GITHUB_SHA."
              return 1
            fi
          }

          ensure_release_tag "$tag"

          if gh release view "$tag" \
            --repo "$GITHUB_REPOSITORY" \
            --json assets,isDraft,isImmutable,isPrerelease,tagName,targetCommitish,url \
            > "$release_json" 2>/dev/null; then
            is_draft="$(jq -r '.isDraft' "$release_json")"
            if [[ "$is_draft" == 'true' ]] &&
              [[ "$(jq -r '.targetCommitish' "$release_json")" != "$GITHUB_SHA" ]]; then
              echo "::error::Existing draft $tag targets a different commit."
              exit 1
            fi
            if [[ "$is_draft" == 'false' ]]; then
              tag_sha="$(
                gh api "repos/$GITHUB_REPOSITORY/commits/$tag" --jq '.sha'
              )"
              if [[ "$tag_sha" != "$GITHUB_SHA" ]]; then
                echo "::error::Existing tag $tag resolves to $tag_sha instead of $GITHUB_SHA."
                exit 1
              fi
              mapfile -t published_names < <(
                jq -r '.assets[].name' "$release_json" | sort
              )
              if [[ "$(jq -r '.isImmutable' "$release_json")" != 'true' ]] ||
                [[ "$(jq -r '.isPrerelease' "$release_json")" != 'false' ]] ||
                ! diff -u \
                  <(printf '%s\n' "${expected_names[@]}") \
                  <(printf '%s\n' "${published_names[@]}"); then
                echo "::error::Published release assets drifted from the exact three-file contract."
                exit 1
              fi
              if ! jq -e \
                'all(.assets[]; ((.digest // "") | startswith("sha256:")))' \
                "$release_json" >/dev/null; then
                echo "::error::Published release is missing GitHub SHA-256 asset digests."
                exit 1
              fi
              verify_immutable_release "$tag"
              echo "::notice::Idempotent rerun: immutable $tag already matches this commit and the exact three-asset contract."
              exit 0
            fi
          else
            gh release create "$tag" \
              --repo "$GITHUB_REPOSITORY" \
              --target "$GITHUB_SHA" \
              --title "$title" \
              --notes-file "$notes" \
              --verify-tag \
              --draft
          fi

          if gh release view "$tag" \
            --repo "$GITHUB_REPOSITORY" \
            --json assets > "$release_json" 2>/dev/null; then
            while IFS= read -r stale_name; do
              if [[ -n "$stale_name" ]] &&
                ! printf '%s\n' "${expected_names[@]}" | grep -Fxq "$stale_name"; then
                gh release delete-asset "$tag" "$stale_name" \
                  --repo "$GITHUB_REPOSITORY" \
                  --yes
              fi
            done < <(jq -r '.assets[].name' "$release_json")
          fi
          gh release upload "$tag" "$assets"/* \
            --repo "$GITHUB_REPOSITORY" \
            --clobber
          gh release edit "$tag" \
            --repo "$GITHUB_REPOSITORY" \
            --title "$title" \
            --notes-file "$notes" \
            --draft \
            --prerelease=false

          gh release view "$tag" \
            --repo "$GITHUB_REPOSITORY" \
            --json assets,isDraft,isPrerelease,targetCommitish,url \
            > "$release_json"
          mapfile -t draft_names < <(jq -r '.assets[].name' "$release_json" | sort)
          if [[ "$(jq -r '.isDraft' "$release_json")" != 'true' ]] ||
            [[ "$(jq -r '.isPrerelease' "$release_json")" != 'false' ]] ||
            [[ "$(jq -r '.targetCommitish' "$release_json")" != "$GITHUB_SHA" ]] ||
            ! diff -u \
              <(printf '%s\n' "${expected_names[@]}") \
              <(printf '%s\n' "${draft_names[@]}"); then
            echo "::error::Draft release assembly is incomplete or contains extra assets."
            exit 1
          fi
          mkdir -p "$remote_dir"
          gh release download "$tag" \
            --repo "$GITHUB_REPOSITORY" \
            --dir "$remote_dir"
          for name in "${expected_names[@]}"; do
            local_hash="$(sha256sum "$assets/$name" | awk '{print $1}')"
            remote_hash="$(sha256sum "$remote_dir/$name" | awk '{print $1}')"
            if [[ "$local_hash" != "$remote_hash" ]]; then
              echo "::error::Draft release byte mismatch: $name"
              exit 1
            fi
          done

          current_build="${PERFECT_ARTIFACT_VERSION##*.}"
          latest_flag='--latest'
          while IFS= read -r published_tag; do
            if [[ "$published_tag" =~ -build\.([0-9]+)$ ]] &&
              (( 10#${BASH_REMATCH[1]} > 10#$current_build )); then
              latest_flag='--latest=false'
              break
            fi
          done < <(
            gh release list \
              --repo "$GITHUB_REPOSITORY" \
              --exclude-drafts \
              --limit 100 \
              --json tagName \
              --jq '.[].tagName'
          )
          ensure_release_tag "$tag"
          gh release edit "$tag" \
            --repo "$GITHUB_REPOSITORY" \
            --draft=false \
            --prerelease=false \
            "$latest_flag"
          gh release view "$tag" \
            --repo "$GITHUB_REPOSITORY" \
            --json assets,isDraft,isImmutable,isPrerelease \
            > "$release_json"
          mapfile -t published_names < <(
            jq -r '.assets[].name' "$release_json" | sort
          )
          if [[ "$(jq -r '.isDraft' "$release_json")" != 'false' ]] ||
            [[ "$(jq -r '.isImmutable' "$release_json")" != 'true' ]] ||
            [[ "$(jq -r '.isPrerelease' "$release_json")" != 'false' ]] ||
            ! diff -u \
              <(printf '%s\n' "${expected_names[@]}") \
              <(printf '%s\n' "${published_names[@]}"); then
            echo "::error::Published release is mutable, incomplete, or incorrectly classified."
            exit 1
          fi
          if ! jq -e \
            'all(.assets[]; ((.digest // "") | startswith("sha256:")))' \
            "$release_json" >/dev/null; then
            echo "::error::Published release is missing GitHub SHA-256 asset digests."
            exit 1
          fi
          verify_immutable_release "$tag"
          echo "::notice::Published $tag with exactly three verified install-ready assets."
