# Perfect is deliberately a personal, private workspace. This document is the
# source-of-truth for trusted GitHub Actions build transport and private
# GitHub Releases. The repository is private; releases are install/update
# delivery for the single owner, never a public store or distribution promise.
product:
  display_name: "Perfect!"
  slug: perfect
  version_source: pubspec semantic version plus Android epoch and the deterministic GitHub Actions run number
  channel: private GitHub Releases backed by short-lived Actions transport
  public_releases: false
  private_github_releases: true

targets:
  android:
    application_id: com.k1tvkli2003.perfect
    architectures: [universal-release-apk]
    version_mapping:
      version_name: pubspec MAJOR.MINOR.PATCH
      version_code: pubspec BUILD epoch plus GitHub Actions run number
    artifact: perfect-MAJOR.MINOR.PATCH-build.VERSION_CODE-android-universal.apk
    signing: stable private JKS supplied only through GitHub Actions secrets
    signing_certificate_pin: PERFECT_ANDROID_CERT_SHA256 repository variable
  windows:
    architecture: x64
    release_artifacts: [self-contained-msix-bootstrap-exe, portable-runtime-zip]
    ci_transport: [signed-private-msix, public-install-certificate, signed-bootstrap-exe]
    identity: com.k1tvkli2003.perfect
    publisher: CN=K1 Perfect Private
    version_mapping:
      msix_version: MAJOR.MINOR.PATCH.GITHUB_RUN_NUMBER
    signing: stable private PFX supplied only through GitHub Actions secrets
    signing_certificate_pin: PERFECT_WINDOWS_CERT_THUMBPRINT repository variable

workflow:
  default_branch: main
  triggers: [pull_request, push-to-main, workflow_dispatch]
  trusted_signing_events: [push-to-main, workflow_dispatch-on-main]
  artifact_retention_days: 14
  optional_runtime_secrets:
    - PERFECT_SUPABASE_URL
    - PERFECT_SUPABASE_PUBLISHABLE_KEY
    - PERFECT_OWNER_AUTH_EMAIL
  windows_signing_secrets:
    - PERFECT_WINDOWS_PFX_BASE64
    - PERFECT_WINDOWS_PFX_PASSWORD
  android_signing_secrets:
    - PERFECT_ANDROID_KEYSTORE_BASE64
    - PERFECT_ANDROID_KEYSTORE_PASSWORD
    - PERFECT_ANDROID_KEY_ALIAS
    - PERFECT_ANDROID_KEY_PASSWORD
  public_identity_variables:
    - PERFECT_ANDROID_CERT_SHA256
    - PERFECT_WINDOWS_CERT_THUMBPRINT
  publication: trusted-main-success-to-draft-then-private-github-release
  release_assets:
    - Perfect-MAJOR.MINOR.PATCH-build.VERSION_CODE-Android.apk
    - Perfect-MAJOR.MINOR.PATCH-build.VERSION_CODE-Windows-Setup.exe
    - Perfect-MAJOR.MINOR.PATCH-build.VERSION_CODE-Windows-Portable.zip

constraints:
  - Do not put the owner's auth email, Supabase credentials, Android keystores, PFX files, or passwords in this repository or workflow.
  - Trusted configured builds map the fixed private username to PERFECT_OWNER_AUTH_EMAIL at compile time; the transport email is never shown in the sign-in UI and the password is never embedded.
  - Pull requests and manual runs outside main never receive Supabase or signing secrets; private signing runs only for trusted push-to-main or workflow_dispatch-on-main builds.
  - A rerun keeps the same Android versionCode and MSIX version, while each later workflow run receives a larger revision for in-place upgrades.
  - The checked-in pubspec BUILD value is an Android epoch. It may increase but never decrease, and lets trusted CI remain above private/local artifacts that were installed before the workflow lineage began.
  - CI rejects a semantic-version regression against the previous commit so the four-part MSIX version remains install-over compatible.
  - Trusted builds fail closed when a signing secret or public certificate pin is missing; verification-only PR builds use the debug key and are never labeled update-compatible.
  - Secret values are supplied through protected environment/stdin boundaries and never placed in a child process command line.
  - The Android application ID, JKS alias/certificate fingerprint, Windows package identity/publisher, and PFX thumbprint are immutable update-lineage fields.
  - Every trusted main/manual-main workflow publishes exactly one immutable-version private GitHub Release after all quality, Android, Windows, installer, and install-over gates pass; pull requests never publish.
  - The three user-facing release assets are exactly one signed universal APK, one signed self-contained Windows Setup EXE, and one portable runtime ZIP. CER, raw MSIX, checksum files, logs, and transport wrappers are never release assets.
  - Release checksums are calculated after final signing/compression, recorded in the release notes, and verified again after downloading the draft assets from GitHub so no fourth checksum file is required.
  - The portable ZIP carries the complete application-local Visual C++ runtime but excludes CI-only checksum manifests and has no redundant wrapper directory.
  - The Windows Setup EXE embeds the signed MSIX and pinned public certificate, verifies both before mutation, imports only the exact certificate into LocalMachine TrustedPeople, installs or upgrades the same MSIX package family, and rolls back newly added trust if installation fails. It never imports into Trusted Root.
  - The bootstrap compiler is the official Inno Setup 7.0.2 x64 immutable release, downloaded from its versioned upstream URL and accepted only after its pinned SHA-256 and Authenticode signature pass.
  - Every trusted Windows build with an older artifact from the same pinned signer installs that prior MSIX and then the current MSIX on the ephemeral runner, proving that package family and an exact LocalState marker survive the version increase; the first valid signer build establishes the baseline.
  - The established Windows signing identity is a self-signed end-entity certificate. MSIX packaging and install-over verification both prove that exact pinned BasicConstraints/Subject/Issuer identity. During install-over, CI temporarily enables the two Windows sideload policy paths, imports only that public certificate into LocalMachine TrustedPeople, restores prior policy values, and removes temporary package/trust state; Trusted Root is never mutated.
  - The MSIX certificate is trusted only on the user's own Windows devices; no store or public trust is implied.
  - The public CER and raw MSIX may travel only inside CI transport and inside the self-contained Setup payload; they are not separate release downloads. The matching PFX must remain a repository secret.
  - If signing secrets are absent, untrusted CI keeps compilation verifiable but labels the resulting artifacts as non-durable fallbacks; trusted CI stops instead of publishing a misleading replacement identity.
