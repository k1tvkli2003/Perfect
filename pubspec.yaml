name: perfect
description: "A private, cross-device personal workspace."
homepage: https://github.com/k1tvkli2003/Perfect
repository: https://github.com/k1tvkli2003/Perfect
issue_tracker: https://github.com/k1tvkli2003/Perfect/issues
publish_to: 'none'
version: 1.1.0+2000

environment:
  sdk: ^3.12.0

dependencies:
  archive: ^4.0.9
  drift: ^2.34.3
  # Project-owned Perfect pictograms stay crisp from compact Android chips to
  # high-DPI Windows and tablet surfaces.
  drift_flutter: ^0.3.1
  file_selector: ^1.1.0
  flutter:
    sdk: flutter
  flutter_local_notifications: ^22.2.0
  flutter_svg: ^2.3.0
  flutter_timezone: ^5.1.0
  # Provides the background-isolate bridge for Android widget actions. The
  # widget UI itself remains native RemoteViews so it can scroll and resize.
  home_widget: ^0.9.3
  package_info_plus: ^10.2.1
  path_provider: ^2.1.6
  # Local microphone capture only. Audio is bounded, sent to the authenticated
  # private Edge Function, then removed from the device temp directory.
  record: ^7.1.1
  share_plus: ^13.3.0
  shared_preferences: ^2.5.4
  supabase_flutter: ^2.12.0
  timezone: ^0.11.1
  uuid: ^4.3.3

dev_dependencies:
  build_runner: ^2.15.1
  drift_dev: ^2.34.5
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4
  flutter_test:
    sdk: flutter
  msix: ^3.18.0

# `path_provider_android` 2.3.x pulls JNI, whose current Android Gradle setup
# is incompatible with Flutter's AGP 9 template on this project. Keep this
# narrow, compatible implementation until the upstream JNI/AGP path is proven.
dependency_overrides:
  path_provider_android: 2.2.22

flutter:
  uses-material-design: true
  assets:
    - assets/brand/
    - assets/icons/perfect/
  fonts:
    - family: PlusJakarta
      fonts:
        - asset: assets/fonts/PlusJakartaSans-Variable.ttf
    - family: Vazirmatn
      fonts:
        - asset: assets/fonts/Vazirmatn-Variable.ttf

flutter_launcher_icons:
  android: true
  image_path: assets/brand/perfect-launcher.png
  min_sdk_android: 24
  # Stock Android launchers replace transparent adaptive backgrounds with a
  # black system surface. Keep the source/legacy/Windows mark transparent, but
  # use this quiet pastel platform fill so no white/black fallback appears.
  adaptive_icon_background: "#FFF3E8"
  adaptive_icon_foreground: assets/brand/perfect-launcher.png
  # The selected art intentionally fills its transparent 512px master. A 19%
  # platform inset maps the complete Day Compass into Android's <=66dp safe
  # zone inside the 108dp adaptive layer, so launcher masks never crop a petal.
  adaptive_icon_foreground_inset: 19
  adaptive_icon_monochrome: assets/brand/perfect-launcher-monochrome.png
  windows:
    # The plugin emits only one 256px ICO frame. The checked-in Day Compass ICO
    # is instead generated by tool/generate_day_compass_assets.py with the full
    # Explorer/taskbar/window size matrix.
    generate: false
    image_path: assets/brand/perfect-launcher.png
    icon_size: 256

# Perfect! is installed privately, but an MSIX identity is still important:
# Windows notification replacement/cancellation and reliable upgrades require
# package identity. The signing key is supplied only through GitHub secrets.
msix_config:
  display_name: Perfect!
  publisher_display_name: K1
  identity_name: com.k1tvkli2003.perfect
  publisher: CN=K1 Perfect Private
  msix_version: 1.1.0.0
  logo_path: assets/brand/perfect-windows-icon.png
  architecture: x64
  build_windows: false
  output_path: build/windows/x64/msix
  output_name: Perfect-private
  capabilities: internetClient, microphone
  protocol_activation: perfect
  install_certificate: false
